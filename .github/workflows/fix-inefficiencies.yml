name: Fix critical inefficiencies (duplicate routes, O(n) BFS, AST cache)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode and unpack
        env:
          B64: ""
        run: |
          echo "$B64" | base64 -d > /tmp/f.tgz
          tar xzf /tmp/f.tgz -C .
          test -f _bundle/app/main.py

      - name: Apply fixes
        run: |
          python3 _apply_fixes.py
          rm -rf _bundle _apply_fixes.py /tmp/f.tgz

      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/services/simulator.py app/policy_as_code/evaluator.py
          echo "all files compile"

      - name: Verify zero duplicate routes
        run: |
          python3 - << 'EOF'
          import re, collections
          s = open("app/main.py").read()
          routes = re.findall(r'@app\.(get|post|patch|delete|put)\(["\'](/[^"\']+)', s)
          dupes = [(v, m) for (m, v), c in collections.Counter(routes).items() if c > 1]
          print(f"routes: {len(routes)}, duplicates: {len(dupes)}")
          assert not dupes, f"duplicate routes remain: {dupes}"
          print("clean")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "fix: remove 528-line duplicate block from main.py, O(1) BFS deque, lru_cache AST parse"
            git push
          fi
