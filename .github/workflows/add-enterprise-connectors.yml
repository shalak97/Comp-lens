name: Enterprise-grade connectors (resilience layer, no demos)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/e.tgz
          tar xzf /tmp/e.tgz -C .
          test -f _bundle/app/connectors/http_client.py
      - name: Apply
        run: |
          python3 _apply_ent.py
          rm -rf _bundle _apply_ent.py /tmp/e.tgz e.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/connectors/http_client.py app/connectors/okta.py app/connectors/secondary.py app/connectors/catalog.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: enterprise connector resilience — retries, backoff, 429 handling, circuit breaker, SSRF guard, credential redaction; all connectors production-grade"
            git push; fi
