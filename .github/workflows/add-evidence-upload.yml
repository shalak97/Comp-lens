name: Add evidence collection via document upload

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/e.tgz
          tar xzf /tmp/e.tgz -C .
          test -f _apply_evidence_upload.py
      - name: Apply idempotent patch
        run: |
          python3 _apply_evidence_upload.py
          rm -f _apply_evidence_upload.py /tmp/e.tgz e.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: evidence collection via document upload (base64 PDF/text -> existing evidence store)"
            git push; fi
