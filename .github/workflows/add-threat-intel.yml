name: Add threat intelligence (CISA KEV + EPSS + NVD enrichment)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/t.tgz
          tar xzf /tmp/t.tgz -C .
          test -f app/services/threat_intel.py
      - name: Apply idempotent patch
        run: |
          python3 _apply_threat.py
          rm -f _apply_threat.py _threat_endpoints.txt /tmp/t.tgz t.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/services/threat_intel.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: threat intelligence — CISA KEV + EPSS + NVD feeds, blast-radius enrichment, threat-intel dashboard"
            git push; fi
