name: Wire dashboard into API

on:
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Place dashboard into app/static/
        run: |
          mkdir -p app/static
          if [ -f dashboard.html ]; then
            cp -f dashboard.html app/static/dashboard.html
            rm -f dashboard.html
            echo "placed root dashboard.html -> app/static/"
          elif [ -f app/static/dashboard.html ]; then
            echo "app/static/dashboard.html already present"
          else
            echo "::error::Upload dashboard.html to the repo root first."
            exit 1
          fi

      - name: Ensure /dashboard route in main.py (idempotent)
        run: |
          if grep -q "_serve_dashboard" app/main.py; then
            echo "route already present"
          else
            echo "" | base64 -d >> app/main.py
            echo "route appended"
          fi

      - name: Verify main.py compiles
        run: python3 -m py_compile app/main.py && echo "compiles"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "feat: single unified compliance dashboard at /dashboard"
            git push
          fi
