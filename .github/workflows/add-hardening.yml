name: Add production hardening (rate limit, security headers, structured errors)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/h.tgz
          tar xzf /tmp/h.tgz -C .
          test -f app/hardening.py
          echo unpacked
      - name: Apply idempotent patch
        run: |
          python3 _apply_hard.py
          rm -f _apply_hard.py /tmp/h.tgz h.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/config.py app/hardening.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: production hardening — rate limiting, security headers, request ids, structured errors, deep readiness"
            git push; fi
