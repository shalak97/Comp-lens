name: Add evidence trust features (timestamps+decay, signing, crosswalk, OSCAL)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard - evidence policy (evidence-plus) must be deployed
        run: |
          test -f app/services/evidence_policy.py || { echo "::error::Run evidence-plus.yml first"; exit 1; }
          grep -q "evidence/compliance" app/main.py || { echo "::error::Run evidence-plus.yml first"; exit 1; }

      - name: Decode and unpack bundle (3 services + migration + patch script)
        run: |
          echo "" | base64 -d > /tmp/ev_v2.tgz
          tar xzf /tmp/ev_v2.tgz -C .
          ls -la app/services/evidence_sign.py app/services/crosswalk.py app/services/oscal_export.py alembic/versions/d4e5f6a7b8c9_evidence_signatures.py

      - name: Apply idempotent patches
        run: |
          python3 _apply_evidence_v2.py
          rm -f _apply_evidence_v2.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" ||             git commit -m "feat: evidence timestamps+decay, cryptographic signing, cross-framework crosswalk, OSCAL export" && git push
