name: CI

# The real continuous-integration gate: lint + tests on every push and PR.
# Unlike the other files in this directory (which are one-shot scaffolding
# jobs that generate and commit code), this one VERIFIES the codebase and
# blocks merge on failure. It does not write to the repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: ruff check
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      ENABLE_SCHEDULER: "false"
      COMP_LENS_SECRET_KEY: ci-secret-key
      EVIDENCE_SIGNING_KEY: ci-signing-key
      DATABASE_URL: "sqlite+pysqlite:////tmp/complens_ci.db"
      # Repo runs in-place (no packaging step): put the project root on the import
      # path so bare `alembic` and `pytest` can `import app...`. Without this both
      # fail with "ModuleNotFoundError: No module named 'app'".
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations (schema builds cleanly from scratch)
        run: alembic upgrade head
      - name: Run test suite
        # Coverage is REPORTED, not gated. There is no --cov-fail-under, on
        # purpose: nobody has ever measured this codebase, so any threshold
        # picked today would be invented rather than informed. Measure first,
        # let the number aim the next round of test writing, and add a floor
        # later once it means something.
        run: pytest -q -p no:randomly --cov=app --cov-report=term-missing:skip-covered

      - name: Coverage summary
        if: always()
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "coverage summary unavailable" >> "$GITHUB_STEP_SUMMARY"
