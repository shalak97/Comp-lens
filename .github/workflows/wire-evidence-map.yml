name: Wire evidence mindmap into API

on:
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move evidence-map.html into app/static/
        run: |
          mkdir -p app/static
          if [ -f evidence-map.html ]; then
            git mv -f evidence-map.html app/static/evidence-map.html
            echo "moved evidence-map.html -> app/static/"
          elif [ -f app/static/evidence-map.html ]; then
            echo "already in app/static/ -- ok"
          else
            echo "::error::evidence-map.html not found at repo root. Upload it first."
            exit 1
          fi

      - name: Add /evidence-map route to main.py (idempotent)
        run: |
          if grep -q "_serve_evidence_map" app/main.py; then
            echo "route already present -- skipping"
          else
            echo "" | base64 -d >> app/main.py
            echo "route appended to app/main.py"
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/evidence-map.html
          git diff --cached --quiet || git commit -m "feat: serve evidence mindmap at /evidence-map"
          git push
