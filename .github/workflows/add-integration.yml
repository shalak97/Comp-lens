name: Add integration layer (policy/AI-gov/threat → findings + risk)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/i.tgz
          tar xzf /tmp/i.tgz -C .
          test -f app/services/integration.py
      - name: Apply idempotent patch
        run: |
          python3 _apply_integ.py
          rm -f _apply_integ.py _integ_endpoints.txt /tmp/i.tgz i.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/services/integration.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: integration layer — policy decisions become findings, AI systems become risks, threat intel escalates risk"
            git push; fi
