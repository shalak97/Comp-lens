name: Add GRC Trust Telemetry (configurable inherited-trust scoring)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        env:
          B64: ""
        run: |
          echo "$B64" | base64 -d > /tmp/g.tgz
          tar xzf /tmp/g.tgz -C .
          test -f _bundle/app/grc_platforms/trust_telemetry.py
      - name: Apply
        run: |
          python3 _apply.py
          rm -rf _bundle _apply.py /tmp/g.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/grc_platforms/trust_telemetry.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: GRC Trust Telemetry - configurable inherited-trust scoring (freshness/corroboration/conflict), tunable as code via TrustPolicy"
            git push; fi
