name: Add self-hosted auto-deploy (Docker Compose + installer)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode and unpack
        env:
          B64: ""
        run: |
          echo "$B64" | base64 -d > /tmp/d.tgz
          tar xzf /tmp/d.tgz -C .
          test -f _bundle/install.sh

      - name: Apply
        run: |
          python3 _apply_deploy.py
          rm -rf _bundle _apply_deploy.py /tmp/d.tgz

      - name: Validate
        run: |
          bash -n install.sh
          python3 -c "import yaml; list(yaml.safe_load_all(open('docker-compose.yml')))"
          echo "install.sh and docker-compose.yml valid"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x install.sh
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "feat: self-hosted auto-deploy — docker-compose, one-command install.sh, Makefile"
            git push
          fi
