name: Add evidence URL ingestion + compliance-as-code

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard - prerequisite features must be deployed
        run: |
          grep -q "def add_evidence_document" app/main.py || { echo "::error::Run evidence-graph.yml first"; exit 1; }
          test -f app/services/resolver.py || { echo "::error::Run ontology-routing.yml first"; exit 1; }

      - name: Decode and unpack bundle (4 new files + patch script)
        run: |
          echo "" | base64 -d > /tmp/ev_plus.tgz
          tar xzf /tmp/ev_plus.tgz -C .
          ls -la app/services/doc_fetch.py app/services/evidence_policy.py app/data/evidence_policy.json app/policy/evidence_compliance.rego

      - name: Add pypdf dependency
        run: grep -q "pypdf" requirements.txt || echo "pypdf>=4.0.0" >> requirements.txt

      - name: Apply idempotent patches to main.py and resolver.py
        run: |
          python3 _apply_evidence_plus.py
          rm -f _apply_evidence_plus.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" ||             git commit -m "feat: evidence URL ingestion (SSRF-guarded) + compliance-as-code on evidence" && git push
