name: Add GRC-platform connector set (Vanta / Drata / OneTrust)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        env:
          B64: ""
        run: |
          echo "$B64" | base64 -d > /tmp/g.tgz
          tar xzf /tmp/g.tgz -C .
          test -f _bundle/app/grc_platforms/base.py
      - name: Apply
        run: |
          python3 _apply_grc.py
          rm -rf _bundle _apply_grc.py /tmp/g.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/grc_platforms/base.py app/grc_platforms/service.py app/grc_platforms/connector.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: GRC-platform connector set (Vanta/Drata/OneTrust) - inherited trust telemetry, mutually-exclusive from native connectors, multi-source attestation"
            git push; fi
