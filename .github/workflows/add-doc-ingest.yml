name: Add document ingestion (doc to markdown to controls to telemetry)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/d.tgz
          tar xzf /tmp/d.tgz -C .
          test -f app/services/doc_ingest.py
          echo unpacked
      - name: Apply idempotent patch
        run: |
          python3 _apply_doc.py
          rm -f _apply_doc.py _doc_endpoints.txt /tmp/d.tgz d.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/services/doc_ingest.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: document ingestion — doc to markdown to controls to telemetry events"
            git push; fi
