name: Add control-dependency cascade simulator (what-if / blast radius)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard - evidence policy must be deployed
        run: |
          test -f app/services/evidence_policy.py || { echo "::error::Run evidence-plus.yml first"; exit 1; }
          grep -q "evidence/compliance" app/main.py || { echo "::error::Run evidence-plus.yml first"; exit 1; }

      - name: Decode and unpack bundle (2 services + 2 data files + patch)
        run: |
          echo "" | base64 -d > /tmp/sim.tgz
          tar xzf /tmp/sim.tgz -C .
          ls -la app/services/dependency_graph.py app/services/simulator.py app/data/control_dependencies.json app/data/nist_related.json

      - name: Apply idempotent patch
        run: |
          python3 _apply_simulator.py
          rm -f _apply_simulator.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" ||             git commit -m "feat: control-dependency cascade simulator (what-if blast radius + structural fragility)" && git push
