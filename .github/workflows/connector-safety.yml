name: Add connector safety guardrails (kill-switch + allowlist + read-only)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard - connector framework must exist
        run: test -f app/connectors/framework.py || { echo "::error::deploy connectors-v2 first"; exit 1; }
      - name: Decode and unpack
        run: |
          echo "" | base64 -d > /tmp/safety.tgz
          tar xzf /tmp/safety.tgz -C .
          test -f app/connectors/safety.py && test -f tests/test_connector_safety.py
          echo "unpacked"
      - name: Apply idempotent patch
        run: |
          python3 _apply_safety.py
          rm -f _apply_safety.py /tmp/safety.tgz safety.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/connectors/safety.py app/connectors/framework.py app/main.py tests/test_connector_safety.py
          echo "compiles"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: connector safety guardrails - kill-switch, allowlist, read-only enforcement"
            git push; fi
