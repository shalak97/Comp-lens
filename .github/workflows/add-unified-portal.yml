name: Unified trust portal (standards crosswalk + YAML-loadable platform profiles)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        env:
          B64: ""
        run: |
          echo "$B64" | base64 -d > /tmp/u.tgz
          tar xzf /tmp/u.tgz -C .
          test -f _bundle/app/grc_platforms/crosswalk.py
      - name: Apply
        run: |
          python3 _apply.py
          rm -rf _bundle _apply.py /tmp/u.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/grc_platforms/crosswalk.py app/grc_platforms/loader.py app/grc_platforms/base.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: unified trust portal - standards-based control crosswalk (SOC2/ISO27001/CIS), YAML-loadable platform profiles, transparent mapping confidence"
            git push; fi
