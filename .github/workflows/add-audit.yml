name: Add audit management (lifecycle + PBC requests + export package)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/a.tgz
          tar xzf /tmp/a.tgz -C .
          test -f app/audit_models.py
          test -f alembic/versions/d0e1f2a3b4c5_audit_mgmt.py
          echo unpacked
      - name: Apply idempotent patch
        run: |
          python3 _apply_audit.py
          rm -f _apply_audit.py _audit_endpoints.txt /tmp/a.tgz a.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/audit_models.py app/services/audit_service.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: audit management — engagement lifecycle, control checklist, PBC evidence requests, auditor export package"
            git push; fi
