name: Add GRC Risk Register + TPRM vendor lifecycle

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/grc.tgz
          tar xzf /tmp/grc.tgz -C .
          test -f app/grc_tprm_models.py && test -f app/services/grc_tprm.py
          test -f alembic/versions/a7b8c9d0e1f2_grc_tprm.py
          echo "unpacked"
      - name: Apply idempotent patch
        run: |
          python3 _apply_grc.py
          rm -f _apply_grc.py /tmp/grc.tgz grc.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/grc_tprm_models.py app/services/grc_tprm.py
          echo "compiles"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: GRC risk register + TPRM vendor lifecycle (models, migration, endpoints)"
            git push; fi
