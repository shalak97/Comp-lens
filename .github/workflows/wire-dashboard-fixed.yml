name: Wire dashboard into API (robust)

on:
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Place dashboard into app/static/
        run: |
          mkdir -p app/static
          if [ -f dashboard.html ]; then
            cp -f dashboard.html app/static/dashboard.html
            rm -f dashboard.html
            echo "copied root dashboard.html -> app/static/ and removed root copy"
          elif [ -f app/static/dashboard.html ]; then
            echo "no root file; app/static/dashboard.html already present"
          else
            echo "::error::No dashboard.html at repo root or app/static/. Upload to root first."
            exit 1
          fi

      - name: Ensure /dashboard route in main.py (idempotent)
        run: |
          if grep -q "_serve_dashboard" app/main.py; then
            echo "route already present -- skipping"
          else
            echo "" | base64 -d >> app/main.py
            echo "route appended to app/main.py"
          fi

      - name: Verify main.py compiles
        run: |
          python3 -m py_compile app/main.py && echo "main.py compiles"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit -- already wired"
          else
            git commit -m "chore: wire latest dashboard into app/static and serve at /dashboard"
            git push
          fi
