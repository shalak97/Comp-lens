name: Add dynamic compliance-as-code engine

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/p.tgz
          tar xzf /tmp/p.tgz -C .
          test -f app/policy_as_code/engine.py
          test -d policies
      - name: Apply idempotent patch
        run: |
          python3 _apply_policy.py
          rm -f _apply_policy.py _policy_endpoints.txt /tmp/p.tgz p.tgz
      - name: Syntax check + policy tests
        run: |
          pip install pyyaml
          python3 -m py_compile app/main.py app/policy_as_code/engine.py app/policy_as_code/evaluator.py
          python3 cli/complens_policy.py --policies ./policies test
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: dynamic compliance-as-code — functions, quantifiers, multi-rule, severity escalation, obligations, composition"
            git push; fi
