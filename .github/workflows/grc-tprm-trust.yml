name: Add GRC + TPRM + Trust Graph (connected telemetry)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/t.tgz
          tar xzf /tmp/t.tgz -C .
          test -f app/services/trust_graph.py
          test -f alembic/versions/b8c9d0e1f2a3_vendor_connector_link.py
          echo "unpacked"
      - name: Apply idempotent patch
        run: |
          python3 _apply_full.py
          rm -f _apply_full.py /tmp/t.tgz t.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/grc_tprm_models.py app/services/grc_tprm.py app/services/trust_graph.py
          echo "compiles"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: trust graph + live telemetry linking connectors, controls, risks, vendors"
            git push; fi
