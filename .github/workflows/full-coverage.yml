name: Add full framework coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack new files (catalog loader, attestation service, ISO catalog, migration)
        run: echo "" | base64 -d | tar xzf - -C .

      - name: Fetch NIST 800-53 OSCAL and generate compact catalog
        run: |
          curl -fsSL -o /tmp/nist.json "https://raw.githubusercontent.com/usnistgov/oscal-content/main/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json"
          python3 app/data/frameworks/_gen_nist.py
          rm -f app/data/frameworks/_gen_nist.py

      - name: Append ControlAttestation model (idempotent)
        run: |
          if grep -q "class ControlAttestation" app/models.py; then
            echo "model present -- skip"
          else
            printf '\n\n' >> app/models.py
            echo "" | base64 -d >> app/models.py
            echo "model appended"
          fi

      - name: Append catalog + attestation endpoints (idempotent)
        run: |
          if grep -q "catalog_frameworks" app/main.py; then
            echo "endpoints present -- skip"
          else
            printf '\n\n' >> app/main.py
            echo "" | base64 -d >> app/main.py
            echo "endpoints appended"
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: full NIST 800-53 + ISO 27001 catalog with attestation workflow"
          git push
