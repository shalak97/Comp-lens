name: Add AI governance (privacy-enhancing technologies + dynamic risk)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack
        run: |
          echo "$B64" | base64 -d > /tmp/g.tgz
          tar xzf /tmp/g.tgz -C .
          test -f app/services/ai_governance.py
          test -f alembic/versions/f1a2b3c4d5e6_ai_pets.py
      - name: Apply idempotent patch
        run: |
          python3 _apply_aigov.py
          rm -f _apply_aigov.py _aigov_endpoints.txt /tmp/g.tgz g.tgz
      - name: Syntax check
        run: |
          python3 -m py_compile app/main.py app/models.py app/services/ai_governance.py app/ai_governance_models.py
          echo compiles
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "feat: AI governance — privacy-enhancing technologies (DP/HE/FL/MPC), dynamic privacy-risk scoring, EU AI Act mapping"
            git push; fi
