name: Add prescriptive remediation optimizer (leverage + CIS + effort)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard - simulator (dependency graph) must be deployed
        run: |
          test -f app/services/dependency_graph.py || { echo "::error::Run simulator.yml first"; exit 1; }
          grep -q "control_fragility" app/main.py || { echo "::error::Run simulator.yml first"; exit 1; }

      - name: Decode and unpack bundle (service + 4 knowledge-base files + patch)
        run: |
          echo "" | base64 -d > /tmp/rem.tgz
          tar xzf /tmp/rem.tgz -C .
          ls -la app/services/remediation_optimizer.py app/data/control_guidance.json app/data/control_baselines.json app/data/cis_mappings.json app/data/family_effort.json

      - name: Apply idempotent patch
        run: |
          python3 _apply_remediation.py
          rm -f _apply_remediation.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" ||             git commit -m "feat: prescriptive remediation optimizer (dependency leverage + CIS actions + effort heuristics)" && git push
