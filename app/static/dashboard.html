    {id:"cc72",label:"CC7.2",tier:1,type:"requirement",col:"--steel"},
    {id:"ia2",label:"IA-2",tier:2,type:"control",col:"--pass"},
    {id:"sc28",label:"SC-28",tier:2,type:"control",col:"--fail"},
    {id:"au2",label:"AU-2",tier:2,type:"control",col:"--pass"},
    {id:"au9",label:"AU-9",tier:2,type:"control",col:"--warn"},
  ];
  const edges = vendor ? [
    ["cf","edge"],["cf","log"],["dd","log"],["cf","app"],
    ["edge","sc7"],["log","au9"],["app","sc28"],
  ] : [
    ["soc2","cc61"],["soc2","cc67"],["soc2","cc72"],
    ["cc61","ia2"],["cc67","sc28"],["cc72","au2"],["cc72","au9"],
  ];
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  // assign 3D coords: tier along X; ring in Y-Z plane within tier
  const tiers={0:[],1:[],2:[]};nodes.forEach(n=>tiers[n.tier].push(n));
  Object.entries(tiers).forEach(([tt,arr])=>{
    const t=+tt, n=arr.length, R=n>1?1.7:0;
    arr.forEach((nd,i)=>{const a=(i/n)*Math.PI*2 + (t*0.6);
      nd.x=(t-1)*2.3; nd.y=R*Math.cos(a); nd.z=R*Math.sin(a);});
  });
  const risky=id=>{const c=byId[id].col;return c==="--fail"||c==="--warn";};
  edges.forEach(e=>e.push(risky(e[1])||risky(e[0])));
  return {nodes,edges,byId};
}

function drawGraph2D(host,model,vendor){
  const W=760,H=420,cx=W/2,cy=H/2,SX=150,SY=64;
  const px=n=>cx+n.x*SX, py=n=>cy+n.y*SY*1.15;
  const node=(n,ni)=>{const c=`var(${n.col})`;const r=n.tier===0?22:n.tier===1?16:13;const x=px(n),y=py(n);
    return `<g class="gnode" onclick="graphNodeDetail(GMODEL,GMODEL.nodes[${ni}])"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r+10}" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="var(--face)" stroke="${c}" stroke-width="2"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r-7}" fill="${c}" opacity="0.16"/>
      <text x="${x.toFixed(1)}" y="${(y-r-7).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="var(--ink)">${esc(n.label)}</text>
      <text x="${x.toFixed(1)}" y="${(y+r+15).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono" font-size="8.5" letter-spacing="1" fill="var(--faint)">${esc(n.type.toUpperCase())}</text></g>`;};
  const edge=e=>{const a=model.byId[e[0]],b=model.byId[e[1]],risk=e[2];
    return `<line x1="${px(a).toFixed(1)}" y1="${py(a).toFixed(1)}" x2="${px(b).toFixed(1)}" y2="${py(b).toFixed(1)}" stroke="${risk?'var(--fail)':'var(--rule2)'}" stroke-width="${risk?1.6:1}" stroke-dasharray="${risk?'4 3':'none'}" opacity="${risk?.7:.5}"/>`;};
  host.innerHTML=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:620px;max-width:780px;margin:0 auto;display:block">
    ${model.edges.map(edge).join("")}${model.nodes.map((n,i)=>node(n,i)).join("")}</svg></div>`;
}

function drawGraph3D(host,model){
  host.innerHTML=`<canvas id="gcanvas" style="width:100%;height:460px;display:block;cursor:grab;touch-action:none"></canvas>`;
  const cv=$("#gcanvas"),ctx=cv.getContext("2d");
  let yaw=0.5, pitch=-0.35, dragging=false, lx=0, ly=0, vyaw=0.0035, idle=true, dragMoved=false, proj=[];
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);const w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);return{w,h};}
  let dim=size();
  const onResize=()=>{dim=size();};
  window.addEventListener("resize",onResize);
  function rot(p){
    // yaw around Y, then pitch around X
    let x=p.x,y=p.y,z=p.z;
    let cz=Math.cos(yaw),sz=Math.sin(yaw); let x1=x*cz+z*sz, z1=-x*sz+z*cz;
    let cx2=Math.cos(pitch),sx2=Math.sin(pitch); let y1=y*cx2-z1*sx2, z2=y*sx2+z1*cx2;
    return{x:x1,y:y1,z:z2};
  }
  function frame(){
    const {w,h}=dim, cx=w/2, cy=h/2, UNIT=Math.min(w,h)/5.4, f=6;
    const col={ink:cssvar("--ink"),face:cssvar("--face"),rule:cssvar("--rule2"),fail:cssvar("--fail"),
      faint:cssvar("--faint")};
    ctx.clearRect(0,0,w,h);
    if(idle){yaw+=vyaw;}
    const P=model.nodes.map(n=>{const r=rot(n);const scale=f/(f-r.z);return{n,rx:r.x,ry:r.y,rz:r.z,
      sx:cx+r.x*scale*UNIT, sy:cy-r.y*scale*UNIT, scale};});
    const pid=Object.fromEntries(P.map(p=>[p.n.id,p]));
    proj=P.map(p=>({n:p.n,sx:p.sx,sy:p.sy,r:(p.n.tier===0?14:p.n.tier===1?10:8.5)*p.scale}));
    // edges first
    model.edges.forEach(e=>{const a=pid[e[0]],b=pid[e[1]],risk=e[2];
      const depth=(a.scale+b.scale)/2;
      ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);
      ctx.strokeStyle=risk?col.fail:col.rule; ctx.globalAlpha=clamp(0.18+(depth-0.7)*0.7,0.1,0.85);
      ctx.lineWidth=risk?1.8:1; if(risk)ctx.setLineDash([5,4]);else ctx.setLineDash([]);
      ctx.stroke();});
    ctx.setLineDash([]);ctx.globalAlpha=1;
    // nodes far→near
    P.sort((a,b)=>a.rz-b.rz).forEach(p=>{
      const c=cssvar(p.n.col); const base=p.n.tier===0?14:p.n.tier===1?10:8.5;
      const r=base*p.scale; const a=clamp(0.45+(p.scale-0.7)*0.9,0.4,1);
      ctx.globalAlpha=a;
      ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,7);ctx.fillStyle=col.face;ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle=c;ctx.stroke();
      ctx.globalAlpha=a*0.18;ctx.beginPath();ctx.arc(p.sx,p.sy,Math.max(1,r-5),0,7);ctx.fillStyle=c;ctx.fill();
      ctx.globalAlpha=a;
      ctx.fillStyle=col.ink;ctx.font="600 "+(11*Math.max(.8,p.scale)).toFixed(0)+"px 'IBM Plex Mono',monospace";
      ctx.textAlign="center";ctx.fillText(p.n.label,p.sx,p.sy-r-6);
      ctx.globalAlpha=a*0.7;ctx.fillStyle=col.faint;ctx.font="8px 'IBM Plex Mono',monospace";
      ctx.fillText(p.n.type.toUpperCase(),p.sx,p.sy+r+12);
    });
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(frame);
  }
  let raf=requestAnimationFrame(frame);
  function down(e){dragging=true;dragMoved=false;idle=false;cv.style.cursor="grabbing";const t=e.touches?e.touches[0]:e;lx=t.clientX;ly=t.clientY;}
  function move(e){if(!dragging)return;const t=e.touches?e.touches[0]:e;
    if(Math.abs(t.clientX-lx)+Math.abs(t.clientY-ly)>3)dragMoved=true;
    yaw+=(t.clientX-lx)*0.01;pitch=clamp(pitch+(t.clientY-ly)*0.01,-1.3,1.3);lx=t.clientX;ly=t.clientY;e.preventDefault();}
  function up(){dragging=false;cv.style.cursor="grab";setTimeout(()=>{if(!dragging)idle=true;},1500);}
  cv.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false});cv.addEventListener("touchmove",move,{passive:false});cv.addEventListener("touchend",up);
  function hit(x,y){let best=null,bd=1e9;proj.forEach(p=>{const d=Math.hypot(p.sx-x,p.sy-y);if(d<p.r+8&&d<bd){bd=d;best=p;}});return best;}
  cv.addEventListener("click",e=>{if(dragMoved)return;const b=hit(e.offsetX,e.offsetY);if(b)graphNodeDetail(model,b.n);});
  cv.addEventListener("mousemove",e=>{if(dragging)return;cv.style.cursor=hit(e.offsetX,e.offsetY)?"pointer":"grab";});
  window._gstop=function(){cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);
    window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);};
}

const CMD={open:false,q:"",sel:0};
function cmdItems(){
  const nav=[];GROUPS.forEach(([grp,tabs])=>tabs.forEach(([id,name])=>nav.push({id,name,grp,kind:"view"})));
  const acts=[{id:"__theme",name:"Toggle light / dark",grp:"Action",kind:"act"},
    {id:"__settings",name:"Connection settings",grp:"Action",kind:"act"},
    {id:"__demo",name:"Switch to demo data",grp:"Action",kind:"act"}];
  return nav.concat(acts);
}
function openCmd(){CMD.open=true;CMD.q="";CMD.sel=0;
  $("#cmd").innerHTML=`<div class="cmdbox"><div class="cmdin"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="cmdi" placeholder="Jump to a view or run a command…" autocomplete="off"/></div><div class="cmdres" id="cmdr"></div><div class="cmdfoot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div></div>`;
  $("#cmd").classList.add("on");
  const i=$("#cmdi");i.focus();
  i.oninput=()=>{CMD.q=i.value;CMD.sel=0;drawCmd();};
  $("#cmd").onclick=e=>{if(e.target.id==="cmd")closeCmd();};
  drawCmd();
}
function closeCmd(){CMD.open=false;$("#cmd").classList.remove("on");}
function cmdFiltered(){const q=CMD.q.toLowerCase();return cmdItems().filter(x=>(x.name+" "+x.grp).toLowerCase().includes(q));}
function drawCmd(){
  const items=cmdFiltered();CMD.sel=clamp(CMD.sel,0,Math.max(0,items.length-1));
  $("#cmdr").innerHTML=items.map((x,i)=>`<div class="cmdr ${i===CMD.sel?'sel':''}" data-i="${i}">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">${x.kind==="act"?'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>':(ICON[x.id]||ICON.overview)}</svg>
    <span>${esc(x.name)}</span><span class="ch">${esc(x.grp)}</span></div>`).join("")||`<div style="padding:18px;text-align:center;color:var(--steel);font-size:12px">No matches</div>`;
  $("#cmdr").querySelectorAll(".cmdr").forEach(r=>r.onclick=()=>runCmd(items[+r.dataset.i]));
}
function runCmd(x){if(!x)return;closeCmd();
  if(x.kind==="act"){if(x.id==="__theme")toggleTheme();else if(x.id==="__settings")openSettings();else if(x.id==="__demo")useDemo();return;}
  STATE.active=x.id;render();window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();CMD.open?closeCmd():openCmd();return;}
  if(!CMD.open)return;
  if(e.key==="Escape")closeCmd();
  else if(e.key==="ArrowDown"){e.preventDefault();CMD.sel++;drawCmd();}
  else if(e.key==="ArrowUp"){e.preventDefault();CMD.sel--;drawCmd();}
  else if(e.key==="Enter"){e.preventDefault();runCmd(cmdFiltered()[CMD.sel]);}
});

/* ===================== BOOT ===================== */
(function boot(){
  let theme="light";try{theme=localStorage.getItem("cl-theme")||"light";}catch(e){}
  applyTheme(theme);
  try{STATE.demo=localStorage.getItem("cl-demo")==="1";}catch(e){}
  buildNav();
  updateDemoSwitch();
  detectMode().then(()=>{
    renderDataBanner();
    render();
    maybeShowConsent();
    if(STATE.demo)toast("Demo data on — sample dataset, not live data","warn");
    else if(STATE.mode==="offline")toast("Can't reach the API — views are empty (demo is off)","warn");
  });
})();
</script>
