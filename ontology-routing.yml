name: Add ontology-driven telemetry routing

on:
  workflow_dispatch:

jobs:
  routing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require evidence-graph + full-coverage to have run first
        run: |
          if [ ! -f app/data/concept_lexicon.json ] || [ ! -f app/data/frameworks/nist_800_53.json ]; then
            echo "::error::Run 'Add full framework coverage' then 'Add evidence mindmap' first — routing depends on the catalogs + lexicon."
            exit 1
          fi

      - name: Unpack resolver + generator + migration
        run: echo "" | base64 -d | tar xzf - -C .

      - name: Generate telemetry_ontology.json + control_bindings.json
        run: |
          python3 app/data/_gen_ontology.py
          rm -f app/data/_gen_ontology.py

      - name: Append RoutingDecision model (idempotent)
        run: |
          if grep -q "class RoutingDecision" app/models.py; then echo "model present -- skip"; else
            printf '\n\n' >> app/models.py; echo "" | base64 -d >> app/models.py; echo "model appended"; fi

      - name: Append resolver endpoints (idempotent)
        run: |
          if grep -q "def resolve_control" app/main.py; then echo "endpoints present -- skip"; else
            printf '\n\n' >> app/main.py; echo "" | base64 -d >> app/main.py; echo "endpoints appended"; fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: ontology-driven telemetry routing (resolver + planes + bindings)"
          git push
