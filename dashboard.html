<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comp-Lens 2.0 — Compliance Console</title>
<style>
:root{
  --bg:#0a0d14; --bg2:#0d1119; --card:#11151f; --card2:#151a26;
  --line:rgba(120,140,175,.14); --line2:rgba(120,140,175,.22);
  --txt:#e6ebf5; --dim:#8b97ad; --mid:#6b7689;
  --hi:#5b9cf6; --pass:#34d399; --fail:#f87171; --warn:#fbbf24; --info:#38bdf8;
  --purple:#a78bfa; --mono:ui-monospace,'JetBrains Mono',Menlo,monospace;
  --r:12px; --r2:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
/* sidebar */
#nav{width:225px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:20}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--hi),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.brand .sub{font-size:10.5px;color:var(--mid);margin-top:3px;font-family:var(--mono)}
.navgroup{padding:12px 10px 2px}
.navgroup .lbl{font-size:9.5px;letter-spacing:.8px;color:var(--mid);text-transform:uppercase;padding:0 10px 5px;font-weight:600}
.tab{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r2);cursor:pointer;
  color:var(--dim);font-size:13px;font-weight:500;transition:.12s;border:1px solid transparent}
.tab:hover{background:var(--card);color:var(--txt)}
.tab.on{background:rgba(91,156,246,.12);color:#bcd4f6;border-color:rgba(91,156,246,.25)}
.tab svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
.navfoot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
.connpill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);font-family:var(--mono);
  padding:7px 10px;border-radius:var(--r2);background:var(--card);cursor:pointer}
.connpill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--pass);box-shadow:0 0 8px var(--pass)}
.dot.demo{background:var(--warn)}
.dot.off{background:var(--fail)}
/* main */
#main{flex:1;margin-left:225px;padding:26px 30px;max-width:1500px}
.view-head{margin-bottom:20px}
.view-head h2{font-size:21px;font-weight:680;letter-spacing:-.2px}
.view-head .d{color:var(--dim);font-size:13px;margin-top:3px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:650;margin-bottom:3px}
.card .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.callout{background:rgba(91,156,246,.07);border:1px solid rgba(91,156,246,.2);border-radius:var(--r2);
  padding:12px 14px;font-size:12.5px;color:var(--dim);margin-bottom:16px;line-height:1.55}
.callout b{color:var(--txt)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent,var(--hi));
  border-radius:var(--r2);padding:14px 16px}
.kpi .k{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.2px}
.kpi .v{font-size:26px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mid);margin-top:2px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--dim);font-weight:600;font-size:11px;
  letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line2)}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(255,255,255,.018)}
.mono{font-family:var(--mono);font-size:12px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-pass{background:rgba(52,211,153,.14);color:var(--pass)}
.b-fail{background:rgba(248,113,113,.15);color:var(--fail)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-info{background:rgba(56,189,248,.14);color:var(--info)}
.b-dim{background:rgba(124,138,165,.14);color:var(--mid)}
.b-hi{background:rgba(91,156,246,.15);color:var(--hi)}
/* buttons */
.btn{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:var(--r2);cursor:pointer;
  border:1px solid var(--line2);background:var(--card2);color:var(--txt);transition:.12s}
.btn:hover{border-color:var(--hi);color:#bcd4f6}
.btn.primary{background:var(--hi);border-color:var(--hi);color:#06101f}
.btn.primary:hover{background:#74aef8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:11.5px}
/* seg control */
.seg{font-size:11.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);
  background:var(--card);color:var(--dim);cursor:pointer;font-weight:600}
.seg.on{background:rgba(91,156,246,.18);color:#bcd4f6;border-color:rgba(91,156,246,.4)}
.segrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
/* progress bar */
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pass),var(--info))}
/* empty/loading */
.empty{padding:38px;text-align:center;color:var(--mid);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);
  border-top-color:var(--hi);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:11px 20px;
  font-size:13px;z-index:100;transition:.3s;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,12,.7);z-index:90;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);
  padding:22px;width:440px;max-width:92vw}
.modal h3{font-size:16px;margin-bottom:14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:9px 11px;color:var(--txt);font-size:13px;font-family:var(--mono)}
.fld input:focus{outline:none;border-color:var(--hi)}
/* connector marketplace */
.mkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.mkt-card{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:15px;
  display:flex;flex-direction:column;gap:9px}
.mkt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mkt-name{font-weight:650;font-size:14px}
.mkt-cat{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mid);margin-top:2px}
.mkt-meta{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.mkt-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.mkt-actions .btn{flex:1}
.mkt-msg{font-size:11px;color:var(--mid);min-height:14px}
.roi{font-size:11px;font-family:var(--mono);color:var(--pass)}
/* graph */
.gwrap{position:relative;height:560px;border-radius:var(--r);overflow:hidden;background:#080b11;border:1px solid var(--line)}
#gcanvas{width:100%;height:100%;display:block;cursor:grab}
.ghud{position:absolute;inset:0;pointer-events:none;padding:16px 18px;display:flex;justify-content:space-between}
.ghud .col{pointer-events:auto;display:flex;flex-direction:column;gap:6px}
.ghud .col.r{align-items:flex-end}
.gleg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.gleg .d{width:9px;height:9px;border-radius:50%}
.gleg .l{width:14px;height:2px;border-radius:1px}
#ginfo{background:rgba(10,13,20,.92);border:1px solid var(--line2);border-radius:var(--r2);
  padding:11px 13px;font-size:11.5px;color:var(--dim);min-width:175px;max-width:230px;display:none}
.scroll{overflow-x:auto}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:280px}
a.lnk{color:var(--hi);text-decoration:none}
a.lnk:hover{text-decoration:underline}
@media(max-width:760px){
  #nav{transform:translateX(-100%);transition:.2s}#nav.open{transform:none}
  #main{margin-left:0;padding:18px}
  .menubtn{display:flex!important}
}
.menubtn{display:none;position:fixed;top:14px;left:14px;z-index:30;width:38px;height:38px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line2);align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body><div class="menubtn" onclick="document.getElementById('nav').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</div>
<div id="app">
  <aside id="nav">
    <div class="brand">
      <h1><span class="logo">◆</span> Comp-Lens 2.0</h1>
      <div class="sub">Compliance-as-Code</div>
    </div>
    <div id="navtabs"></div>
    <div class="navfoot">
      <div class="connpill" id="connpill" onclick="openSettings()">
        <span class="dot off" id="conndot"></span>
        <span id="connlabel">Connecting…</span>
      </div>
    </div>
  </aside>
  <main id="main"><div class="empty"><span class="spin"></span> Loading…</div></main>
</div>
<div id="toast"></div>
<div class="modal" id="settings">
  <div class="box">
    <h3>Connection settings</h3>
    <div class="fld">
      <label>API base URL</label>
      <input id="cfgBase" placeholder="https://comp-lens-2-0.onrender.com"/>
    </div>
    <div class="fld">
      <label>API key (optional — leave blank if not required)</label>
      <input id="cfgKey" type="password" placeholder="X-API-Key header value"/>
    </div>
    <div class="fld">
      <label>Tenant ID</label>
      <input id="cfgTenant" placeholder="default"/>
    </div>
    <div style="display:flex;gap:9px;margin-top:18px">
      <button class="btn primary" onclick="saveSettings()" style="flex:1">Save & reconnect</button>
      <button class="btn" onclick="useDemoMode()">Use demo data</button>
    </div>
    <div style="font-size:11px;color:var(--mid);margin-top:12px;line-height:1.5">
      Credentials are kept only in this browser tab's memory — never written to disk or sent anywhere except your API.
    </div>
  </div>
</div>
<script>
/* ============ CONFIG + STATE ============ */
const DEFAULT_BASE = "https://comp-lens-2-0.onrender.com";
const CFG = { base: DEFAULT_BASE, key: "", tenant: "default" };
const STATE = { mode: "connecting", active: "overview", cache: {} };

/* ============ DOM HELPERS ============ */
const $ = s => document.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
function main() { const m = $("#main"); m.innerHTML = ""; return m; }
function view(title, desc) {
  const v = el("div", "view");
  const h = el("div", "view-head");
  h.innerHTML = `<h2>${title}</h2>${desc ? `<div class="d">${desc}</div>` : ""}`;
  v.appendChild(h);
  return v;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2400); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtPct(n){return (n==null||isNaN(n))?"—":(+n).toFixed(1)+"%";}
function fmtDate(s){if(!s)return"never";try{return new Date(s).toLocaleString();}catch(e){return s;}}
function ago(s){if(!s)return"never";const d=(Date.now()-new Date(s))/1000;
  if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";
  if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";}

/* ============ API CLIENT (auto-detect live/demo) ============ */
async function api(path, opts) {
  const url = CFG.base.replace(/\/$/, "") + path;
  const headers = { "Content-Type": "application/json" };
  if (CFG.key) headers["X-API-Key"] = CFG.key;
  const r = await fetch(url, { ...opts, headers });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function apiGET(path) { return api(path); }
async function apiPOST(path, body) { return api(path, { method: "POST", body: JSON.stringify(body || {}) }); }

function withTenant(path){const sep=path.includes("?")?"&":"?";return path+sep+"tenant_id="+encodeURIComponent(CFG.tenant);}

/* try the API; set mode live/demo/off */
async function detectMode() {
  setConn("connecting", "Connecting…");
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch(CFG.base.replace(/\/$/, "") + "/health/live", { signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) { STATE.mode = "live"; setConn("live", "Live · " + hostOf(CFG.base)); return; }
    throw new Error("not ok");
  } catch (e) {
    STATE.mode = "demo"; setConn("demo", "Demo data");
  }
}
function hostOf(u){try{return new URL(u).host.replace("www.","");}catch(e){return u;}}
function setConn(cls, label) {
  const d = $("#conndot"), l = $("#connlabel");
  if (d) d.className = "dot " + (cls === "live" ? "live" : cls === "demo" ? "demo" : "off");
  if (l) l.textContent = label;
}

/* fetch with demo fallback: returns {data, live} */
async function load(path, demo) {
  if (STATE.mode === "demo") return { data: demo, live: false };
  try { return { data: await apiGET(path), live: true }; }
  catch (e) { return { data: demo, live: false }; }
}

/* ============ SETTINGS ============ */
function openSettings() {
  $("#cfgBase").value = CFG.base; $("#cfgKey").value = CFG.key; $("#cfgTenant").value = CFG.tenant;
  $("#settings").classList.add("on");
}
function closeSettings(){$("#settings").classList.remove("on");}
async function saveSettings() {
  CFG.base = $("#cfgBase").value.trim() || DEFAULT_BASE;
  CFG.key = $("#cfgKey").value.trim();
  CFG.tenant = $("#cfgTenant").value.trim() || "default";
  closeSettings();
  await detectMode();
  toast(STATE.mode === "live" ? "Connected to " + hostOf(CFG.base) : "Could not reach API — using demo data");
  render();
}
function useDemoMode() { STATE.mode = "demo"; setConn("demo", "Demo data"); closeSettings(); toast("Switched to demo data"); render(); }
$("#settings").addEventListener("click", e => { if (e.target.id === "settings") closeSettings(); });

/* ============ NAV / ROUTER ============ */
const GROUPS = [
  ["Posture", [["overview","Overview","M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"],
               ["controls","Controls","M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"],
               ["findings","Findings","M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"],
               ["frameworks","Frameworks","M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 016.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"]]],
  ["Evidence", [["connectors","Connectors","M12 2v6m0 8v6M2 12h6m8 0h6M5 5l4 4m6 6l4 4M19 5l-4 4m-6 6l-4 4"],
                ["graph","3D Graph","M12 2a10 10 0 100 20 10 10 0 000-20zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"],
                ["evidence","Evidence Docs","M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6"],
                ["evmap","Evidence Map","M9 20l-5.4 1.8a1 1 0 01-1.3-1V5.6a1 1 0 01.7-1L9 3m0 17l6-2m-6 2V3m6 15l5.4 1.8a1 1 0 001.3-1V5.6a1 1 0 00-.7-1L15 3m0 15V3m0 0L9 5"]]],
  ["Intelligence", [["simulator","Blast Radius","M13 2L3 14h7l-1 8 10-12h-7l1-8z"],
                    ["remediation","Remediation","M9 11l3 3L22 4M12 2a10 10 0 100 20 10 10 0 000-20"],
                    ["trends","Trends","M3 3v18h18M7 14l4-4 3 3 5-5"],
                    ["inventory","AI Inventory","M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"],
                    ["waivers","Waivers","M9 12l2 2 4-4M21 12c0 5-3.5 7.5-8.5 9.5C7.5 19.5 4 17 4 12V5l8-3 8 3v7z"]]]
];
const RENDER = {};  // populated by feature files

function buildNav() {
  const c = $("#navtabs");
  c.innerHTML = "";
  GROUPS.forEach(([label, tabs]) => {
    const g = el("div", "navgroup");
    g.innerHTML = `<div class="lbl">${label}</div>`;
    tabs.forEach(([id, name, icon]) => {
      const t = el("div", "tab" + (STATE.active === id ? " on" : ""));
      t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${icon}"/></svg><span>${name}</span>`;
      t.onclick = () => { STATE.active = id; buildNav(); render(); $("#nav").classList.remove("open"); window.scrollTo(0,0); };
      g.appendChild(t);
    });
    c.appendChild(g);
  });
}

function render() {
  buildNav();
  const fn = RENDER[STATE.active];
  if (fn) { try { fn(); } catch (e) { main().innerHTML = `<div class="empty">Render error: ${esc(e.message)}</div>`; console.error(e); } }
  else main().innerHTML = `<div class="empty">Unknown tab</div>`;
}

/* ============ BOOT ============ */
async function boot() {
  buildNav();
  await detectMode();
  render();
  if (STATE.mode === "demo") toast("Showing demo data — open connection settings to go live");
}
/* ============ DEMO DATA ============ */
const DEMO = {
  summary:{total:148,by_status:{pass:112,fail:24,error:3,not_applicable:6,pending:3},waived:5,
    compliance_score:79.4,risk_weighted_score:82.1,risk_exposure:17.9,framework:"ALL"},
  frameworks:["NIST","ISO27001","SOC2","CIS","ISO42001","NIST_AI_RMF","EU_AI_ACT"],
  controls:[
    {control_id:"AC-2",title:"Account Management",domain:"Access Control",severity:"high",frameworks:{NIST:["AC-2"],ISO27001:["A.5.16"],SOC2:["CC6.2"],CIS:["5.3"]}},
    {control_id:"IA-2",title:"Identification & Authentication",domain:"Identity",severity:"high",frameworks:{NIST:["IA-2"],ISO27001:["A.8.5"],SOC2:["CC6.1"],CIS:["6.3"]}},
    {control_id:"SC-28",title:"Protection of Information at Rest",domain:"System Protection",severity:"high",frameworks:{NIST:["SC-28"],ISO27001:["A.8.24"],SOC2:["CC6.7"]}},
    {control_id:"AU-9",title:"Protection of Audit Information",domain:"Audit",severity:"medium",frameworks:{NIST:["AU-9"],ISO27001:["A.8.15"],SOC2:["CC7.2"]}},
    {control_id:"RA-5",title:"Vulnerability Monitoring",domain:"Risk Assessment",severity:"high",frameworks:{NIST:["RA-5"],ISO27001:["A.8.8"],CIS:["7.1"]}},
    {control_id:"IR-4",title:"Incident Handling",domain:"Incident Response",severity:"medium",frameworks:{NIST:["IR-4"],ISO27001:["A.5.24"],SOC2:["CC7.4"]}},
  ],
  findings:[
    {control_id:"SC-28",status:"fail",severity:"high",title:"S3 bucket without default encryption",source_system:"AWS",detected_at:new Date(Date.now()-2*864e5).toISOString()},
    {control_id:"AC-2",status:"fail",severity:"high",title:"6 dormant accounts not disabled",source_system:"Okta",detected_at:new Date(Date.now()-1*864e5).toISOString()},
    {control_id:"RA-5",status:"fail",severity:"high",title:"1 critical CVE unpatched",source_system:"GitHub",detected_at:new Date(Date.now()-3*864e5).toISOString()},
    {control_id:"AU-9",status:"error",severity:"medium",title:"Log retention check timed out",source_system:"Splunk",detected_at:new Date(Date.now()-5*36e5).toISOString()},
    {control_id:"IA-2",status:"pass",severity:"high",title:"MFA enforced org-wide",source_system:"Entra ID",detected_at:new Date(Date.now()-6*36e5).toISOString()},
  ],
  trends:[

function drawSpark(cvs, vals){
  const dpr=window.devicePixelRatio||1, W=cvs.offsetWidth||600, H=160;
  cvs.width=W*dpr;cvs.height=H*dpr;const x=cvs.getContext("2d");x.scale(dpr,dpr);
  const min=Math.min(...vals)-2, max=Math.max(...vals)+2, pad=14;
  const px=i=>pad+i*(W-2*pad)/Math.max(vals.length-1,1);
  const py=v=>H-pad-(v-min)/(max-min)*(H-2*pad);
  x.strokeStyle="rgba(91,156,246,.9)";x.lineWidth=2;x.beginPath();
  vals.forEach((v,i)=>{i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v));});x.stroke();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(91,156,246,.25)");g.addColorStop(1,"rgba(91,156,246,0)");
  x.lineTo(px(vals.length-1),H-pad);x.lineTo(px(0),H-pad);x.closePath();x.fillStyle=g;x.fill();
  x.fillStyle="#bcd4f6";vals.forEach((v,i)=>{x.beginPath();x.arc(px(i),py(v),3,0,7);x.fill();});
}

    ["RA-5","fail"],["SI-2","pass"],["IR-4","pass"],["SC-12","pass"],["CP-9","pass"],["SI-4","pass"]]

  const R={connector:210,evidence:125,control:55};
  Object.entries(by).forEach(([t,ns])=>{const rad=R[t];ns.forEach((n,i)=>{
    const phi=Math.acos(1-2*(i+.5)/Math.max(ns.length,1)),th=Math.PI*(1+Math.sqrt(5))*i;
    n.x=rad*Math.sin(phi)*Math.cos(th);n.y=rad*Math.sin(phi)*Math.sin(th);n.z=rad*Math.cos(phi);n.vx=n.vy=n.vz=0;});});
}
function simGraph(nodes,edges,idx,steps){

    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,f=80/(dx*dx+dy*dy+dz*dz+1);
      a.vx+=f*dx;a.vy+=f*dy;a.vz+=f*dz;b.vx-=f*dx;b.vy-=f*dy;b.vz-=f*dz;}}
    edges.forEach(({s:si,t:ti})=>{const a=idx[si],b=idx[ti];if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,tg=a.type===b.type?60:90,f=(d-tg)/d*k;
      a.vx+=f*dx;a.vy+=f*dy;a.vz+=f*dz;b.vx-=f*dx;b.vy-=f*dy;b.vz-=f*dz;});

function gProj(n,W,H){const cx=Math.cos(G.rotX),sx=Math.sin(G.rotX),cy=Math.cos(G.rotY),sy=Math.sin(G.rotY);

  const vis=gVis(),pm={};G.nodes.forEach(n=>pm[n.id]=gProj(n,W,H));

  G.edges.forEach(({s:si,t:ti,kind})=>{if(!vis.has(si)||!vis.has(ti))return;const ps=pm[si],pt=pm[ti];if(!ps||!pt)return;
    const hiS=G.sel&&(G.sel===si||G.sel===ti),hiH=G.hov&&(G.hov===si||G.hov===ti),al=hiS?.85:hiH?.5:G.filter==="all"?.18:.1;
    x.beginPath();x.moveTo(ps.x,ps.y);x.lineTo(pt.x,pt.y);
    x.strokeStyle=kind==="hard"?`rgba(248,113,113,${al})`:kind==="ev"?`rgba(52,211,153,${al})`:`rgba(91,156,246,${al})`;
    x.lineWidth=kind==="hard"?1.8:.85;x.stroke();});
  sorted.forEach(({n,p})=>{if(!vis.has(n.id))return;const r=n.r*p.sc*2.2,hi=G.hov===n.id||G.sel===n.id;

    x.beginPath();x.arc(p.x,p.y,r,0,7);x.fillStyle=n.color+(hi?"ff":"cc");x.fill();

}
function gHit(mx,my){const vis=gVis(),cv=G.cv;if(!cv)return null;const W=cv._w,H=cv._h;let best=null,bd=1e9;

    wrap.innerHTML=`<table><thead><tr><th>#</th><th>Control</th><th>Action</th><th>Severity</th><th>Effort</th><th>Risk ↓</th><th>Leverage</th><th>Source</th></tr></thead><tbody>${
      q.map((x,i)=>`<tr><td class="mono">${i+1}</td><td class="mono">${esc(x.control_id)}</td><td>${esc(x.title||x.action||"")}</td>
        <td><span class="badge ${SEV_BADGE[x.severity]||"b-dim"}">${esc(x.severity||"—")}</span></td>
        <td><span class="badge ${x.effort==="low"?"b-pass":x.effort==="medium"?"b-warn":"b-fail"}">${esc(x.effort||"—")}</span></td>
        <td class="mono" style="color:var(--pass)">−${(x.risk_reduction??0).toFixed?.(1)??x.risk_reduction}</td>
        <td class="mono">${(x.leverage??0).toFixed?.(1)??x.leverage}</td>
        <td>${esc(x.connector||x.source||"—")}</td></tr>`).join("")}</tbody></table>`;
    card.appendChild(wrap);}
  host.appendChild(card);
};

/* ============ TRENDS ============ */
RENDER.trends = async function() {
  const m=main(), v=view("Compliance Trends","Score trajectory and drift over time");
  m.appendChild(v);const host=el("div");v.appendChild(host);
  host.innerHTML=`<div class="empty"><span class="spin"></span> Loading trends…</div>`;
  const {data}=await load(withTenant("/trends"),DEMO.trends);
  const tr=Array.isArray(data)?data:[];host.innerHTML="";
  if(!tr.length){host.innerHTML=`<div class="card"><div class="empty">No trend snapshots yet. Snapshots accrue over time (or POST /trends/snapshot).</div></div>`;return;}
  const first=tr[0].compliance_score||0,last=tr[tr.length-1].compliance_score||0,delta=last-first;
  const kp=el("div","kpis");
  [["Current",fmtPct(last),"var(--hi)"],["30-day change",(delta>=0?"+":"")+delta.toFixed(1)+"%",delta>=0?"var(--pass)":"var(--fail)"],["Snapshots",tr.length,"var(--mid)"]]
   .forEach(([k,n,c])=>{const e=el("div","kpi");e.style.setProperty("--accent",c);e.innerHTML=`<div class="k">${k}</div><div class="v">${n}</div>`;kp.appendChild(e);});
  host.appendChild(kp);
  const card=el("div","card");card.innerHTML=`<h3>Score over time</h3>`;
  const cvs=el("canvas");cvs.style.cssText="width:100%;height:220px";card.appendChild(cvs);host.appendChild(card);
  drawSpark(cvs,tr.map(x=>x.compliance_score||0));
};

/* ============ AI INVENTORY ============ */
RENDER.inventory = async function() {
  const m=main(), v=view("AI System Inventory","Registered AI/ML systems for ISO 42001, NIST AI RMF and EU AI Act governance");
  m.appendChild(v);const host=el("div");v.appendChild(host);
  host.innerHTML=`<div class="empty"><span class="spin"></span> Loading inventory…</div>`;
  const {data}=await load(withTenant("/inventory"),DEMO.inventory);
  const inv=Array.isArray(data)?data:[];host.innerHTML="";
  if(!inv.length){host.innerHTML=`<div class="card"><div class="empty">No AI systems registered. Add via POST /ai-systems or run discovery.</div></div>`;return;}
  const high=inv.filter(x=>x.risk_level==="high").length;
  const kp=el("div","kpis");
  [["AI systems",inv.length,"var(--hi)"],["High-risk",high,"var(--fail)"],["Frameworks",[...new Set(inv.flatMap(x=>x.frameworks||[]))].length,"var(--purple)"]]
   .forEach(([k,n,c])=>{const e=el("div","kpi");e.style.setProperty("--accent",c);e.innerHTML=`<div class="k">${k}</div><div class="v">${n}</div>`;kp.appendChild(e);});
  host.appendChild(kp);
  const card=el("div","card");card.innerHTML=`<h3>Registered systems</h3>`;
  const wrap=el("div","scroll");
  wrap.innerHTML=`<table><thead><tr><th>System</th><th>Type</th><th>Risk</th><th>Owner</th><th>Frameworks</th></tr></thead><tbody>${
    inv.map(x=>`<tr><td>${esc(x.name||x.system_name||"")}</td><td>${esc(x.system_type||x.type||"—")}</td>
      <td><span class="badge ${x.risk_level==="high"?"b-fail":x.risk_level==="limited"?"b-warn":"b-dim"}">${esc(x.risk_level||"—")}</span></td>
      <td>${esc(x.owner||"—")}</td><td>${(x.frameworks||[]).map(f=>`<span class="badge b-dim">${esc(f)}</span>`).join(" ")}</td></tr>`).join("")}</tbody></table>`;
  card.appendChild(wrap);host.appendChild(card);
};

/* ============ WAIVERS ============ */
RENDER.waivers = async function() {
  const m=main(), v=view("Waivers & Exceptions","Accepted risk exceptions with expiry tracking");
  m.appendChild(v);const host=el("div");v.appendChild(host);
  host.innerHTML=`<div class="empty"><span class="spin"></span> Loading waivers…</div>`;
  const {data}=await load(withTenant("/waivers"),DEMO.waivers);
  const w=Array.isArray(data)?data:[];host.innerHTML="";
  if(!w.length){host.innerHTML=`<div class="card"><div class="empty">No active waivers. Exceptions can be filed via POST /waivers.</div></div>`;return;}
  const card=el("div","card");card.innerHTML=`<h3>Active waivers</h3><div class="sub">${w.length} accepted exceptions</div>`;
  const wrap=el("div","scroll");
  wrap.innerHTML=`<table><thead><tr><th>Control</th><th>Justification</th><th>Status</th><th>Expires</th></tr></thead><tbody>${
    w.map(x=>{const exp=x.expires_at?new Date(x.expires_at):null;const soon=exp&&(exp-Date.now())<14*864e5;
      return `<tr><td class="mono">${esc(x.control_id||"")}</td><td>${esc(x.reason||x.justification||"")}</td>
      <td><span class="badge ${x.status==="active"?"b-pass":"b-dim"}">${esc(x.status||"—")}</span></td>
      <td class="mono" style="color:${soon?"var(--warn)":"var(--mid)"}">${exp?exp.toLocaleDateString():"—"}${soon?" ⚠":""}</td></tr>`;}).join("")}</tbody></table>`;
  card.appendChild(wrap);host.appendChild(card);
};

boot();
</script>
