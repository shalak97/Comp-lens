# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: comp-lens
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    # NOTE: this blueprint is deliberately free-tier. Render's persistent disks
    # require a paid instance, so there is no disk here and the container's
    # filesystem does not survive a restart or a deploy. See EVIDENCE_BACKEND
    # below for what that costs and the one free way around it.
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: comp-lens-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: false
      - key: ENABLE_DEMO_CONNECTOR
        value: true
      # ─── Evidence storage: know what you are choosing ───────────────
      #
      # 'local' on a free instance means EPHEMERAL. /tmp is discarded on every
      # restart and every deploy, so evidence artifacts do not survive. Findings
      # and posture live in Postgres and are unaffected; what is lost is the
      # stored artifact behind each one.
      #
      # For a hobby deployment that is a reasonable trade — but it is a trade,
      # not an oversight, so it is written here rather than buried.
      #
      # The free way to get durability: any S3-compatible object store with a
      # free tier — Cloudflare R2 gives 10 GB/month at no cost, Backblaze B2
      # gives 10 GB. Set all three of these together and evidence outlives the
      # container at no charge:
      #
      #   EVIDENCE_BACKEND=s3
      #   EVIDENCE_S3_BUCKET=<your bucket>
      #   EVIDENCE_S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com
      #
      # plus AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for that provider.
      # Leave EVIDENCE_S3_ENDPOINT unset for real AWS S3. Do NOT set the
      # backend to s3 on its own — the app refuses to start without a bucket,
      # which is a crash loop rather than a warning.
      - key: EVIDENCE_BACKEND
        value: local
      - key: EVIDENCE_LOCAL_PATH
        value: /tmp/evidence_store
      # - key: EVIDENCE_S3_BUCKET
      #   sync: false
      # - key: EVIDENCE_S3_ENDPOINT
      #   sync: false
      # Run scheduled connector syncs / assessments in-process. Render web
      # services are always-on, so the background runner ticks here. Without
      # this the runner is a no-op and schedules created in the UI/API never
      # execute automatically.
      - key: ENABLE_SCHEDULER
        value: true
      # Required in production — the app refuses to start without these.
      # Set them in the Render dashboard (sync: false keeps them out of git):
      # - key: COMP_LENS_API_KEYS
      #   sync: false          # e.g. "adminkey:*"
      # - key: EVIDENCE_SIGNING_KEY
      #   sync: false          # HMAC key for evidence tamper-evidence
      # Uncomment and fill in the connectors you use:
      # - key: AWS_REGION
      #   value: us-east-1
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false          # prompts for value in Render dashboard
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: GITHUB_TOKEN
      #   sync: false
      # - key: OKTA_ORG_URL
      #   sync: false
      # - key: OKTA_API_TOKEN
      #   sync: false
      # - key: JIRA_URL
      #   sync: false
      # - key: JIRA_EMAIL
      #   sync: false
      # - key: JIRA_API_TOKEN
      #   sync: false

databases:
  # Free tier, chosen deliberately for a hobby deployment — but know the clock:
  # a free Render Postgres EXPIRES 30 days after it is created, gives 14 days'
  # grace to upgrade, and is then deleted along with everything in it. Render
  # emails before both deadlines.
  #
  # So this database is disposable by design. If a deployment ever needs to be
  # kept, `plan: basic-256mb` is the smallest paid tier (~$6/month) and is also
  # the point at which backups exist at all. Until then, treat anything here as
  # reproducible: `make backup` dumps it, and re-running a sync rebuilds
  # posture from the connectors.
  - name: comp-lens-db
    plan: free
    databaseName: complens
    user: complens
