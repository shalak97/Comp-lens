# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: comp-lens
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    # Evidence artifacts have to outlive the container. Without this they were
    # written to /tmp, which Render discards on every restart and every deploy
    # — so each deploy destroyed the chain-of-custody records this product
    # exists to produce.
    #
    # Two costs of a disk, both deliberate and both reversible by moving to S3
    # (see EVIDENCE_BACKEND below): a disk attaches to exactly one instance, so
    # it rules out running more than one, and deploys are no longer
    # zero-downtime. Neither matters at one always-on instance; both are the
    # reason S3 is the right answer once a second instance is wanted.
    #
    # Requires a paid instance type. The service plan is deliberately NOT set
    # here — naming one would silently downgrade the service if it is on
    # something larger than whatever this file guessed.
    disk:
      name: comp-lens-evidence
      mountPath: /var/lib/complens
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: comp-lens-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: false
      - key: ENABLE_DEMO_CONNECTOR
        value: true
      # 'local' now means the persistent disk declared above, not /tmp.
      #
      # To move to S3 instead — the right call once you want more than one
      # instance — set EVIDENCE_BACKEND=s3 and EVIDENCE_S3_BUCKET together, and
      # give the service credentials for the bucket. Do NOT set the backend to
      # s3 on its own: the app refuses to start without a bucket name, which
      # would be a crash loop rather than a misconfiguration warning. The disk
      # can then be removed.
      - key: EVIDENCE_BACKEND
        value: local
      - key: EVIDENCE_LOCAL_PATH
        value: /var/lib/complens/evidence
      # - key: EVIDENCE_S3_BUCKET
      #   sync: false
      # Run scheduled connector syncs / assessments in-process. Render web
      # services are always-on, so the background runner ticks here. Without
      # this the runner is a no-op and schedules created in the UI/API never
      # execute automatically.
      - key: ENABLE_SCHEDULER
        value: true
      # Required in production — the app refuses to start without these.
      # Set them in the Render dashboard (sync: false keeps them out of git):
      # - key: COMP_LENS_API_KEYS
      #   sync: false          # e.g. "adminkey:*"
      # - key: EVIDENCE_SIGNING_KEY
      #   sync: false          # HMAC key for evidence tamper-evidence
      # Uncomment and fill in the connectors you use:
      # - key: AWS_REGION
      #   value: us-east-1
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false          # prompts for value in Render dashboard
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: GITHUB_TOKEN
      #   sync: false
      # - key: OKTA_ORG_URL
      #   sync: false
      # - key: OKTA_API_TOKEN
      #   sync: false
      # - key: JIRA_URL
      #   sync: false
      # - key: JIRA_EMAIL
      #   sync: false
      # - key: JIRA_API_TOKEN
      #   sync: false

databases:
  # A free Render Postgres expires 30 days after creation, allows a 14-day
  # grace period to upgrade, and is then DELETED along with all of its data.
  # That is the whole customer dataset — findings, posture history,
  # attestations — on a countdown, for a product sold as a system of record.
  #
  # basic-256mb is the smallest paid tier ($6/month at time of writing, plus
  # $0.30/GB/month of storage) and is what makes backups and point-in-time
  # recovery available at all.
  - name: comp-lens-db
    plan: basic-256mb
    databaseName: complens
    user: complens
