      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:15px;font-weight:700">${esc(meta.vendor)}</div>
        <span class="badge ${isConn?"b-pass":"b-dim"}">${isConn?"🟢 Connected":"⚪ Not connected"}</span>
      </div>
      <div style="font-size:12px;color:var(--mid);margin-bottom:14px;line-height:1.5">${esc(meta.desc)}</div>
      ${isConn&&stat?`<div style="display:flex;gap:14px;margin-bottom:14px">
        <div><div style="font-family:var(--mono);font-size:20px;font-weight:700">${stat.total}</div><div style="font-size:10px;color:var(--dim)">attestations</div></div>
        <div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--pass)">${stat.pass}</div><div style="font-size:10px;color:var(--dim)">passing</div></div>
        <div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--fail)">${stat.fail}</div><div style="font-size:10px;color:var(--dim)">failing</div></div>
        <div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--hi)">${stat.mapped}</div><div style="font-size:10px;color:var(--dim)">mapped</div></div>
      </div>`:`<div style="font-size:11px;color:var(--dim);margin-bottom:12px">Auth: ${esc(meta.auth)} · Set <span class="mono">${meta.env.slice(0,2).join(", ")}</span> on your deployment</div>`}
      <div style="display:flex;gap:8px">
        <button class="btn sm ${isConn?"":"primary"}" data-sync="${key}">${isConn?"↻ Re-sync":"Sync now"}</button>
        ${!isConn?`<button class="btn sm" onclick="openSelfHost();return false">Setup ↗</button>`:""}
      </div>`;
    grid.appendChild(card);
  });
  host.appendChild(grid);

  // wire sync buttons
  host.querySelectorAll("[data-sync]").forEach(b=>{
    b.onclick=async()=>{const key=b.getAttribute("data-sync");b.disabled=true;b.textContent="syncing…";
      if(STATE.mode==="demo"){await sleep(500);toast(key+" sync simulated — connect on your own deployment for live data");b.disabled=false;b.textContent="↻ Re-sync";return;}
      try{const r=await apiPOST(withTenant("/v1/grc-sync/"+key),{});toast(`${key}: ${r.ingested} attestations (${r.mapped} mapped)`);RENDER.grcplatforms_platforms();}
      catch(e){toast(key+": "+(e.message||"sync failed — check credentials"),"err");b.disabled=false;b.textContent="Sync now";}
    };
  });
};

/* ════════════════════ GRC TRUST TELEMETRY (the scoring layer) ════════════════════ */
RENDER.grcplatforms_trust = async function(){
  const host=main();
  host.innerHTML=skelGrid(3)+skelCard();
  const {data:score}=await load(withTenant("/v1/grc-trust/score"),GRC_PLATFORM_DEMO.trust);
  const {data:ctrlsR}=await load(withTenant("/v1/grc-trust/controls"),GRC_PLATFORM_DEMO.trustControls);
  const {data:platsR}=await load(withTenant("/v1/grc-trust/platforms"),GRC_PLATFORM_DEMO.trustPlatforms);
  host.innerHTML="";

  // explainer
  const banner=el("div","callout");
  banner.innerHTML=`<b>A dedicated trust score for inherited evidence.</b> The GRC platforms only report pass/fail — this layer derives a 0–100 trust score per control from four signals: the verdict, evidence <b>freshness</b> (it decays with age), cross-platform <b>corroboration</b> (agreement raises trust), and <b>conflict</b> (disagreement collapses it). Kept separate from the native trust graph. The weights are tunable below.`;
  host.appendChild(banner);

  const sc=score.grc_trust_score;
  if(sc==null){host.appendChild(Object.assign(el("div","card"),{innerHTML:`<div class="empty">No mapped GRC attestations yet. Connect a platform and sync from the <b>Platforms</b> tab.</div>`}));return;}

  // ── top row: aggregate gauge + breakdown ──
  const top=el("div");top.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px";
  const gaugeCard=el("div","card");
  gaugeCard.innerHTML=`<h3>GRC trust score</h3><div class="sub" style="margin-bottom:6px">Aggregate inherited-trust across ${score.controls_scored} mapped controls</div>
    <div style="display:flex;justify-content:center">${svgGauge(sc,{label:score.band+" trust"})}</div>`;
  top.appendChild(gaugeCard);
  const bd=el("div","card");
  const conflictCol=score.conflicts>0?"var(--fail)":"var(--mid)";
  bd.innerHTML=`<h3>Signal breakdown</h3><div class="sub" style="margin-bottom:14px">What's driving the score</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px">
      <div><div style="font-family:var(--mono);font-size:26px;font-weight:700;color:var(--pass)">${score.corroborated}</div><div style="font-size:11px;color:var(--dim)">corroborated</div></div>
      <div><div style="font-family:var(--mono);font-size:26px;font-weight:700;color:${conflictCol}">${score.conflicts}</div><div style="font-size:11px;color:var(--dim)">conflicts</div></div>
      <div><div style="font-family:var(--mono);font-size:26px;font-weight:700;color:var(--hi)">${score.controls_scored}</div><div style="font-size:11px;color:var(--dim)">controls scored</div></div>
    </div>
    ${score.conflict_controls&&score.conflict_controls.length?`<div style="border-top:1px solid var(--line);padding-top:12px"><div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Conflicts dragging trust down</div>${score.conflict_controls.map(c=>`<span class="badge b-fail" style="margin:2px">${esc(c)}</span>`).join("")}</div>`:`<div style="font-size:12px;color:var(--pass)">No cross-platform conflicts — all multi-source controls agree.</div>`}`;
  top.appendChild(bd);
  host.appendChild(top);

  // ── per-platform standalone trust ──
  const byp=platsR.by_platform||{};
  if(Object.keys(byp).length){
    const platData=Object.entries(byp).map(([k,v])=>({label:k,value:v.trust,color:v.trust>=75?CHART_COL.pass:v.trust>=50?CHART_COL.warn:CHART_COL.fail,display:v.trust+" / 100"}));
    const pcard=el("div","card");
    pcard.innerHTML=`<h3>Per-platform trust</h3><div class="sub" style="margin-bottom:14px">Each platform's standalone trust (no cross-platform corroboration applied)</div>${svgBars(platData,{barH:26,width:460,labelW:90,max:100})}
      <div style="display:flex;gap:18px;margin-top:12px;flex-wrap:wrap">${Object.entries(byp).map(([k,v])=>`<div style="font-size:11px;color:var(--dim)"><b style="color:var(--mid)">${esc(k)}</b>: ${v.attestations} attestations, ${v.passing} passing${v.stale?`, <span style="color:var(--warn)">${v.stale} stale</span>`:""}</div>`).join("")}</div>`;
    host.appendChild(pcard);
  }

  // ── per-control trust (conflicts/lowest first) ──
  const ctrls=ctrlsR.controls||[];
  if(ctrls.length){
    const cc=el("div","card");
    cc.innerHTML=`<h3>Control trust scores</h3><div class="sub" style="margin-bottom:14px">Lowest trust and conflicts first — these are where inherited evidence is weakest</div>`;
    const wrap=el("div","scroll");
    wrap.innerHTML=`<table><thead><tr><th>Control</th><th>Trust</th><th>Band</th><th>Agreement</th><th>Per-source signal</th></tr></thead><tbody>${
      ctrls.map(c=>{
        const tc=c.trust>=75?"var(--pass)":c.trust>=50?"var(--warn)":"var(--fail)";
        const agB=c.agreement==="conflict"?`<span class="badge b-fail">⚠ conflict</span>`:c.agreement==="agree"?`<span class="badge b-pass">✓ agree</span>`:`<span class="badge b-dim">single</span>`;
        const src=(c.sources||[]).map(s=>`<span class="badge ${s.status==="pass"?"b-pass":s.status==="fail"?"b-fail":"b-dim"}" style="font-size:10px">${esc(s.platform)}: ${s.signal!=null?s.signal:s.status}${s.freshness_days!=null?` · ${s.freshness_days}d`:""}</span>`).join(" ");
        return `<tr${c.agreement==="conflict"?' style="background:rgba(248,113,113,.06)"':''}><td class="mono" style="color:var(--hi)">${esc(c.control_id)}</td>
          <td><span style="font-family:var(--mono);font-weight:700;color:${tc}">${c.trust}</span></td>
          <td><span class="badge ${c.band==="high"?"b-pass":c.band==="medium"?"b-warn":"b-fail"}">${esc(c.band||"")}</span></td>
          <td>${agB}</td><td style="font-size:11px">${src}</td></tr>`;
      }).join("")
    }</tbody></table>`;
    cc.appendChild(wrap);host.appendChild(cc);
  }

  // ── POLICY TUNING (tunable-as-code, live preview) ──
  const pol=score.policy||GRC_PLATFORM_DEMO.trust.policy;
  const PT={fresh_days:pol.fresh_days,stale_days:pol.stale_days,conflict_factor:pol.conflict_factor};
  const tune=el("div","card");
  tune.innerHTML=`<h3>Trust policy <span class="badge b-dim" style="font-weight:500">tunable as code</span></h3>
    <div class="sub" style="margin-bottom:16px">These weights are configurable (env <span class="mono">GRC_TRUST_POLICY</span>, or per request). Adjust and preview the impact live — nothing is saved until you set it on your deployment.</div>`;
  const grid=el("div");grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:16px";
  function slider(key,label,min,max,step,hint){
    const w=el("div");
    const lab=el("div");lab.style.cssText="font-size:12px;color:var(--mid);margin-bottom:6px";
    const setL=()=>lab.innerHTML=`${label}: <b style="color:var(--hi)">${PT[key]}</b> <span style="color:var(--dim);font-size:10px">${hint}</span>`;
    const inp=el("input");inp.type="range";inp.min=min;inp.max=max;inp.step=step;inp.value=PT[key];inp.style.cssText="width:100%";
    inp.oninput=()=>{PT[key]=parseFloat(inp.value);setL();schedulePreview();};
    setL();w.appendChild(lab);w.appendChild(inp);return w;
  }
  grid.appendChild(slider("fresh_days","Fresh days",1,30,1,"full trust below this age"));
  grid.appendChild(slider("stale_days","Stale days",10,180,5,"trust floor at/above"));
  grid.appendChild(slider("conflict_factor","Conflict factor",0,1,0.05,"lower = harsher on disagreement"));
  tune.appendChild(grid);
  const result=el("div");result.style.cssText="display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:14px";
  result.innerHTML=`<div style="font-size:12px;color:var(--dim)">Previewed score:</div><div id="ptScore" style="font-family:var(--mono);font-size:28px;font-weight:700;color:var(--hi)">${sc}</div><div id="ptDelta" style="font-size:12px;color:var(--dim)"></div>`;
  tune.appendChild(result);
  host.appendChild(tune);

  let ptTimer=null;
  function schedulePreview(){clearTimeout(ptTimer);ptTimer=setTimeout(runPreview,250);}
  async function runPreview(){
    const scoreEl=document.getElementById("ptScore"),deltaEl=document.getElementById("ptDelta");
    if(!scoreEl)return;
    let newScore;
    if(STATE.mode==="demo"){
      newScore=previewTrustDemo(PT); // local recompute on demo data
    } else {
      try{const r=await apiPOST(withTenant("/v1/grc-trust/score-preview"),{policy:PT});newScore=r.grc_trust_score;}
      catch(e){newScore=sc;}
    }
    scoreEl.textContent=newScore;
    const d=newScore-sc;
    scoreEl.style.color=newScore>=75?"var(--pass)":newScore>=50?"var(--warn)":"var(--fail)";
    deltaEl.innerHTML=d===0?"(no change)":`<span style="color:${d>0?'var(--pass)':'var(--fail)'}">${d>0?'+':''}${d}</span> vs current (${sc})`;
  }
};

// local trust recompute for demo mode — mirrors the backend formula
function previewTrustDemo(pt){
  const ctrls=GRC_PLATFORM_DEMO.trustControls.controls;
  function freshMult(days){if(days==null)return 0.6;if(days<=pt.fresh_days)return 1;if(days>=pt.stale_days)return 0.25;return 1-(1-0.25)*((days-pt.fresh_days)/(pt.stale_days-pt.fresh_days));}
  const statusBase={pass:1,not_applicable:0.5,error:0.3,fail:0};
  let sum=0,n=0;
  ctrls.forEach(c=>{
    const sigs=c.sources.map(s=>(statusBase[s.status]??0.3)*freshMult(s.freshness_days)*0.9);
    const statuses=new Set(c.sources.map(s=>s.status));
    let sc;
    if(statuses.size>1){sc=Math.min(...sigs)*pt.conflict_factor;}
    else{const avg=sigs.reduce((a,b)=>a+b,0)/sigs.length;const bonus=c.sources.length>=3?1.25:c.sources.length===2?1.15:1;sc=Math.min(1,avg*bonus);}
    sum+=Math.round(sc*100);n++;
  });
  return n?Math.round(sum/n):0;
}


boot();
</script>
