<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comp-Lens 2.0 — Compliance Console</title>
<style>
:root{
  --bg:#0a0d14; --bg2:#0d1119; --card:#11151f; --card2:#151a26;
  --line:rgba(120,140,175,.14); --line2:rgba(120,140,175,.22);
  --txt:#e6ebf5; --dim:#8b97ad; --mid:#6b7689;
  --hi:#5b9cf6; --pass:#34d399; --fail:#f87171; --warn:#fbbf24; --info:#38bdf8;
  --purple:#a78bfa; --mono:ui-monospace,'JetBrains Mono',Menlo,monospace;
  --r:12px; --r2:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
/* sidebar */
#nav{width:225px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:20}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--hi),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.brand .sub{font-size:10.5px;color:var(--mid);margin-top:3px;font-family:var(--mono)}
.navgroup{padding:12px 10px 2px}
.navgroup .lbl{font-size:9.5px;letter-spacing:.8px;color:var(--mid);text-transform:uppercase;padding:0 10px 5px;font-weight:600}
.tab{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r2);cursor:pointer;
  color:var(--dim);font-size:13px;font-weight:500;transition:.12s;border:1px solid transparent}
.tab:hover{background:var(--card);color:var(--txt)}
.tab.on{background:rgba(91,156,246,.12);color:#bcd4f6;border-color:rgba(91,156,246,.25)}
.tab svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
.navfoot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
.connpill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);font-family:var(--mono);
  padding:7px 10px;border-radius:var(--r2);background:var(--card);cursor:pointer}
.connpill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--pass);box-shadow:0 0 8px var(--pass)}
.dot.demo{background:var(--warn)}
.dot.off{background:var(--fail)}
/* main */
#main{flex:1;margin-left:225px;padding:26px 30px;max-width:1500px}
.view-head{margin-bottom:20px}
.view-head h2{font-size:21px;font-weight:680;letter-spacing:-.2px}
.view-head .d{color:var(--dim);font-size:13px;margin-top:3px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:650;margin-bottom:3px}
.card .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.callout{background:rgba(91,156,246,.07);border:1px solid rgba(91,156,246,.2);border-radius:var(--r2);
  padding:12px 14px;font-size:12.5px;color:var(--dim);margin-bottom:16px;line-height:1.55}
.callout b{color:var(--txt)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent,var(--hi));
  border-radius:var(--r2);padding:14px 16px}
.kpi .k{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.2px}
.kpi .v{font-size:26px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mid);margin-top:2px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--dim);font-weight:600;font-size:11px;
  letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line2)}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(255,255,255,.018)}
.mono{font-family:var(--mono);font-size:12px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-pass{background:rgba(52,211,153,.14);color:var(--pass)}
.b-fail{background:rgba(248,113,113,.15);color:var(--fail)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-info{background:rgba(56,189,248,.14);color:var(--info)}
.b-dim{background:rgba(124,138,165,.14);color:var(--mid)}
.b-hi{background:rgba(91,156,246,.15);color:var(--hi)}
/* buttons */
.btn{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:var(--r2);cursor:pointer;
  border:1px solid var(--line2);background:var(--card2);color:var(--txt);transition:.12s}
.btn:hover{border-color:var(--hi);color:#bcd4f6}
.btn.primary{background:var(--hi);border-color:var(--hi);color:#06101f}
.btn.primary:hover{background:#74aef8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:11.5px}
/* seg control */
.seg{font-size:11.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);
  background:var(--card);color:var(--dim);cursor:pointer;font-weight:600}
.seg.on{background:rgba(91,156,246,.18);color:#bcd4f6;border-color:rgba(91,156,246,.4)}
.segrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
/* progress bar */
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pass),var(--info))}
/* toggle switch (PET playground) */
.toggle{position:relative;width:42px;height:23px;cursor:pointer;flex-shrink:0;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle .track{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line2);border-radius:23px;transition:.18s}
.toggle .knob{position:absolute;left:3px;top:3px;width:15px;height:15px;background:var(--mid);border-radius:50%;transition:.18s}
.toggle input:checked + .track{background:rgba(91,156,246,.25);border-color:var(--hi)}
.toggle input:checked + .track .knob{transform:translateX(19px);background:var(--hi)}
select{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:9px 11px;color:var(--txt);font-size:13px;font-family:inherit}
select:focus{outline:none;border-color:var(--hi)}
input[type=range]{accent-color:var(--hi)}
/* empty/loading */
.empty{padding:38px;text-align:center;color:var(--mid);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);
  border-top-color:var(--hi);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:11px 20px;
  font-size:13px;z-index:100;transition:.3s;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,12,.7);z-index:90;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);
  padding:22px;width:440px;max-width:92vw}
.modal h3{font-size:16px;margin-bottom:14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:9px 11px;color:var(--txt);font-size:13px;font-family:var(--mono)}
.fld input:focus{outline:none;border-color:var(--hi)}
/* connector marketplace */
.mkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.mkt-card{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:15px;
  display:flex;flex-direction:column;gap:9px}
.mkt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mkt-name{font-weight:650;font-size:14px}
.mkt-cat{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mid);margin-top:2px}
.mkt-meta{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.mkt-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.mkt-actions .btn{flex:1}
.mkt-msg{font-size:11px;color:var(--mid);min-height:14px}
.roi{font-size:11px;font-family:var(--mono);color:var(--pass)}
/* graph */
.gwrap{position:relative;height:560px;border-radius:var(--r);overflow:hidden;background:#080b11;border:1px solid var(--line)}
#gcanvas{width:100%;height:100%;display:block;cursor:grab}
.ghud{position:absolute;inset:0;pointer-events:none;padding:16px 18px;display:flex;justify-content:space-between}
.ghud .col{pointer-events:auto;display:flex;flex-direction:column;gap:6px}
.ghud .col.r{align-items:flex-end}
.gleg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.gleg .d{width:9px;height:9px;border-radius:50%}
.gleg .l{width:14px;height:2px;border-radius:1px}
#ginfo{background:rgba(10,13,20,.92);border:1px solid var(--line2);border-radius:var(--r2);
  padding:11px 13px;font-size:11.5px;color:var(--dim);min-width:175px;max-width:230px;display:none}
.scroll{overflow-x:auto}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:280px}
a.lnk{color:var(--hi);text-decoration:none}
a.lnk:hover{text-decoration:underline}
@media(max-width:760px){
  #nav{transform:translateX(-100%);transition:.2s}#nav.open{transform:none}
  #main{margin-left:0;padding:18px}
  .menubtn{display:flex!important}
}
.menubtn{display:none;position:fixed;top:14px;left:14px;z-index:30;width:38px;height:38px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line2);align-items:center;justify-content:center;cursor:pointer}
/* command palette */
#cmdk{position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:200;display:none;align-items:flex-start;justify-content:center;backdrop-filter:blur(4px);padding-top:12vh}
#cmdk.on{display:flex}
#cmdk .box{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#cmdk input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--txt);font-size:15px;outline:none}
#cmdk input::placeholder{color:var(--mid)}
.cmd-list{max-height:50vh;overflow-y:auto;padding:6px}
.cmd-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmd-item.sel{background:rgba(91,156,246,.14)}
.cmd-item .ico{width:18px;height:18px;opacity:.7;flex-shrink:0}
.cmd-item .lbl{flex:1}
.cmd-item .grp{font-size:11px;color:var(--mid)}
.cmd-empty{padding:24px;text-align:center;color:var(--mid);font-size:13px}
.cmd-hint{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mid)}
.cmd-hint kbd{background:var(--card2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:10px}
.kbd-badge{font-family:var(--mono);font-size:10px;color:var(--mid);background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin-left:6px}
/* export menu */
.exp-btn{position:relative}
.exp-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:200px;z-index:50;box-shadow:0 12px 36px rgba(0,0,0,.5);display:none}
.exp-menu.on{display:block}
.exp-menu .opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:13px}
.exp-menu .opt:hover{background:rgba(91,156,246,.12)}
.exp-menu .opt .d{font-size:11px;color:var(--mid)}
/* ── polish: loading skeletons ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{background:linear-gradient(90deg,var(--card2) 25%,rgba(120,140,175,.10) 50%,var(--card2) 75%);background-size:800px 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}
.skel-row{height:14px;margin:9px 0}
.skel-kpi{height:84px;border-radius:var(--r)}
.skel-card{height:120px;border-radius:var(--r);margin-bottom:14px}
.skel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
/* ── refined empty states ── */
.empty2{text-align:center;padding:48px 24px;color:var(--mid)}
.empty2 .ico{width:46px;height:46px;margin:0 auto 14px;opacity:.4}
.empty2 h4{color:var(--dim);font-size:15px;margin:0 0 6px;font-weight:600}
.empty2 p{font-size:13px;max-width:380px;margin:0 auto 16px;line-height:1.5}
/* ── file dropzone ── */
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--r);padding:32px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--card2)}
.dropzone:hover,.dropzone.drag{border-color:var(--hi);background:rgba(91,156,246,.06)}
.dropzone .ico{width:36px;height:36px;opacity:.5;margin-bottom:10px}
/* ── code/yaml block ── */
.codeblock{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--dim);overflow-x:auto;white-space:pre;max-height:340px;overflow-y:auto}
.codeblock .k{color:var(--hi)}.codeblock .s{color:var(--pass)}.codeblock .c{color:var(--mid)}
/* ── pill toggle ── */
.pilltabs{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px}
.pilltabs button{border:none;background:transparent;color:var(--mid);font-size:12.5px;padding:6px 16px;border-radius:999px;cursor:pointer;transition:.12s}
.pilltabs button.on{background:var(--hi);color:#04121f;font-weight:600}
/* ── mobile: enhance the existing responsive rules ── */
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)!important}
  table{font-size:12px}
  .view-head h2{font-size:19px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr!important}
  .row{flex-direction:column}
}
/* ---- polish pass: loading skeletons ---- */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:6px}
.skel-row{height:14px;margin:9px 0;width:100%}
.skel-row.short{width:55%}.skel-row.mid{width:75%}
.skel-kpi{height:84px;border-radius:var(--r)}
.skel-card{height:120px;border-radius:var(--r);margin-bottom:16px}
.skel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:16px}
/* ---- refined empty states ---- */
.empty2{text-align:center;padding:48px 24px;color:var(--mid)}
.empty2 .ico{width:46px;height:46px;margin:0 auto 14px;opacity:.5}
.empty2 h4{font-size:15px;color:var(--txt);margin-bottom:6px;font-weight:600}
.empty2 p{font-size:13px;max-width:380px;margin:0 auto 16px;line-height:1.5}
/* ---- doc dropzone ---- */
.dropzone{border:2px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;
  cursor:pointer;transition:.15s;background:var(--card)}
.dropzone:hover,.dropzone.drag{border-color:var(--hi);background:var(--card2)}
.dropzone .big{font-size:14px;color:var(--txt);margin-bottom:5px;font-weight:550}
.dropzone .sm{font-size:12px;color:var(--mid)}
/* ---- code / yaml block ---- */
.codeblock{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto;
  white-space:pre;color:#c8d3e6}
.codeblock .k{color:#7dd3fc}.codeblock .s{color:#86efac}.codeblock .c{color:var(--mid)}
/* ---- pill toggle ---- */
.pilltabs{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;margin-bottom:16px}
.pilltabs button{background:transparent;border:none;color:var(--mid);padding:6px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:500}
.pilltabs button.on{background:var(--hi);color:#06122b}
/* ---- status dot ---- */
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* ---- better mobile ---- */
@media(max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)!important;gap:9px}
  .kpi .v{font-size:21px}
  .card{padding:14px}
  table{font-size:12px}td,th{padding:8px 7px}
  .view h1,.view h2{font-size:19px}
  .row{grid-template-columns:1fr!important}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr!important}
  .pilltabs{width:100%;overflow-x:auto}
}
</style>
</head>
<body><div class="menubtn" onclick="document.getElementById('nav').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</div>
<div id="app">
  <aside id="nav">
    <div class="brand">
      <h1><span class="logo">◆</span> Comp-Lens 2.0</h1>
      <div class="sub">Compliance-as-Code</div>
    </div>
    <div id="navtabs"></div>
    <div class="navfoot">
      <div class="connpill" id="connpill" onclick="openSettings()" style="margin-bottom:8px">
        <span class="dot off" id="conndot"></span>
        <span id="connlabel">Connecting…</span>
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn sm" style="flex:1;font-size:11px" onclick="openCmdK()">⌘K Search</button>
        <div class="exp-btn" style="flex:1">
          <button class="btn sm" style="width:100%;font-size:11px" onclick="event.stopPropagation();exportMenu(this.parentElement)">↓ Export</button>
        </div>
      </div>
    </div>
  </aside>
  <main id="main"><div class="empty"><span class="spin"></span> Loading…</div></main>
</div>
<div id="toast"></div>
<div id="cmdk">
  <div class="box">
    <input id="cmdkInput" placeholder="Jump to a tab, export a report, change settings…" autocomplete="off"/>
    <div class="cmd-list" id="cmdkList"></div>
    <div class="cmd-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div class="modal" id="settings">
  <div class="box">
    <h3>Connection settings</h3>
    <div class="fld">
      <label>API base URL</label>
      <input id="cfgBase" placeholder="https://comp-lens-2-0.onrender.com"/>
    </div>
    <div class="fld">
      <label>API key (optional — leave blank if not required)</label>
      <input id="cfgKey" type="password" placeholder="X-API-Key header value"/>
    </div>
    <div class="fld">
      <label>Tenant ID</label>
      <input id="cfgTenant" placeholder="default"/>
    </div>
    <div style="display:flex;gap:9px;margin-top:18px">
      <button class="btn primary" onclick="saveSettings()" style="flex:1">Save & reconnect</button>
      <button class="btn" onclick="useDemoMode()">Use demo data</button>
    </div>
    <div style="font-size:11px;color:var(--mid);margin-top:12px;line-height:1.5">
      Credentials are kept only in this browser tab's memory — never written to disk or sent anywhere except your API.
    </div>
  </div>
</div>
<script>
/* ============ CONFIG + STATE ============ */
const DEFAULT_BASE = "https://comp-lens-2-0.onrender.com";
const CFG = { base: DEFAULT_BASE, key: "", tenant: "default" };
const STATE = { mode: "connecting", active: "overview", cache: {} };

/* ============ DOM HELPERS ============ */
const $ = s => document.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
let RENDER_TARGET = null;
function main() {
  if (RENDER_TARGET) { RENDER_TARGET.innerHTML = ""; return RENDER_TARGET; }
  const m = $("#main"); m.innerHTML = ""; return m;
}

/* ============ API CLIENT (auto-detect live/demo) ============ */
async function api(path, opts) {
  const url = CFG.base.replace(/\/$/, "") + path;
  const headers = { "Content-Type": "application/json" };
  if (CFG.key) headers["X-API-Key"] = CFG.key;
  const r = await fetch(url, { ...opts, headers });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function apiGET(path) { return api(path); }
async function apiPOST(path, body) { return api(path, { method: "POST", body: JSON.stringify(body || {}) }); }
async function apiPATCH(path, body) { return api(withTenant(path), { method: "PATCH", body: JSON.stringify(body || {}) }); }
async function apiDELETE(path) { return api(withTenant(path), { method: "DELETE" }); }

function withTenant(path){const sep=path.includes("?")?"&":"?";return path+sep+"tenant_id="+encodeURIComponent(CFG.tenant);}

/* try the API; set mode live/demo/off */
async function detectMode() {
  setConn("connecting", "Connecting…");
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch(CFG.base.replace(/\/$/, "") + "/health/live", { signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) { STATE.mode = "live"; setConn("live", "Live · " + hostOf(CFG.base)); return; }
    throw new Error("not ok");
  } catch (e) {
    STATE.mode = "demo"; setConn("demo", "Demo data");
  }
}
function hostOf(u){try{return new URL(u).host.replace("www.","");}catch(e){return u;}}
function setConn(cls, label) {
  const d = $("#conndot"), l = $("#connlabel");
  if (d) d.className = "dot " + (cls === "live" ? "live" : cls === "demo" ? "demo" : "off");
  if (l) l.textContent = label;
}

/* fetch with demo fallback: returns {data, live} */
async function load(path, demo) {
  if (STATE.mode === "demo") return { data: demo, live: false };
  try { return { data: await apiGET(path), live: true }; }
  catch (e) { return { data: demo, live: false }; }
}

  order.forEach(([k,lbl,c])=>{const n=bs[k]||0;const pct=100*n/total;
    const row=el("div");row.style.cssText="margin-bottom:11px";
    row.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${lbl}</span><span class="mono">${n} · ${pct.toFixed(0)}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${c}"></i></div>`;card.appendChild(row);});

    const first=tr[0].compliance_score||0, last=tr[tr.length-1].compliance_score||0, delta=last-first;
    tc.innerHTML=`<h3>Compliance trend</h3><div class="sub">Score over recent snapshots · ${(delta>=0?"+":"")+delta.toFixed(1)}% over ${tr.length} snapshots</div>`;
    const cvs=el("canvas");cvs.style.cssText="width:100%;height:160px";tc.appendChild(cvs);rowEl.appendChild(tc);
    setTimeout(()=>drawSpark(cvs, tr.map(x=>x.compliance_score||0)),20);

function drawSpark(cvs, vals){
  const dpr=window.devicePixelRatio||1, W=cvs.offsetWidth||600, H=160;
  cvs.width=W*dpr;cvs.height=H*dpr;const x=cvs.getContext("2d");x.scale(dpr,dpr);
  const min=Math.min(...vals)-2, max=Math.max(...vals)+2, pad=14;
  const px=i=>pad+i*(W-2*pad)/Math.max(vals.length-1,1);
  const py=v=>H-pad-(v-min)/(max-min)*(H-2*pad);
  x.strokeStyle="rgba(91,156,246,.9)";x.lineWidth=2;x.beginPath();
  vals.forEach((v,i)=>{i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v));});x.stroke();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(91,156,246,.25)");g.addColorStop(1,"rgba(91,156,246,0)");
  x.lineTo(px(vals.length-1),H-pad);x.lineTo(px(0),H-pad);x.closePath();x.fillStyle=g;x.fill();
  x.fillStyle="#bcd4f6";vals.forEach((v,i)=>{x.beginPath();x.arc(px(i),py(v),3,0,7);x.fill();});
}

/* Two honest production states: connected (live creds) or not-configured */
function connState(r){
  const live=r.mode==="connected"||r.mode==="live"||r.last_sync_mode==="live";
  if(live) return {id:"live",label:"Connected",cls:"b-pass",dot:"🟢",
    border:"rgba(52,211,153,.4)",tip:"Connected to the real service with valid credentials"};
  return {id:"none",label:"Not configured",cls:"b-dim",dot:"⚪",
    border:"var(--line)",tip:"Production connector — add credentials to connect and pull live evidence"};
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

const G={nodes:[],edges:[],idx:{},rotX:.35,rotY:-.55,zoom:1,drag:false,lx:0,ly:0,hov:null,sel:null,filter:"all",anim:null,cv:null,ctx:null};

function buildGraph(){
  const conns=[["c_aws","AWS","cloud"],["c_okta","Okta","identity"],["c_github","GitHub","devops"],["c_jira","Jira","itsm"],

    E("c_okta","e_mfa_enabled","conn"),E("c_okta","e_priv_users","conn"),E("c_okta","e_logging","conn"),
    E("c_github","e_mfa_enabled","conn"),E("c_github","e_vuln_findings","conn"),
    E("c_jira","e_incidents","conn"),E("c_snow","e_incidents","conn"),E("c_snow","e_patch_status","conn"),

    E("c_entra","e_mfa_enabled","conn"),E("c_entra","e_priv_users","conn"),E("c_ot","e_incidents","conn"),
    E("e_mfa_enabled","ct_IA-2","ev"),E("e_mfa_enabled","ct_AC-2","ev"),E("e_encryption","ct_SC-28","ev"),
    E("e_encryption","ct_SC-12","ev"),E("e_logging","ct_AU-2","ev"),E("e_logging","ct_AU-9","ev"),
    E("e_vuln_findings","ct_RA-5","ev"),E("e_vuln_findings","ct_SI-2","ev"),E("e_incidents","ct_IR-4","ev"),
    E("e_endpoint_prot","ct_SI-4","ev"),E("e_priv_users","ct_AC-2","ev"),E("e_priv_users","ct_AC-3","ev"),E("e_patch_status","ct_SI-2","ev"),
    E("ct_SC-12","ct_SC-28","hard"),E("ct_SC-28","ct_AU-9","hard"),E("ct_AC-2","ct_AC-3","hard"),E("ct_AU-2","ct_AU-9","hard"),E("ct_RA-5","ct_SI-2","hard"),
    // documents → controls (formal evidence, the former Evidence Map links)
    E("d_isp","ct_AC-2","doc"),E("d_isp","ct_SC-28","doc"),E("d_acp","ct_AC-2","doc"),E("d_acp","ct_AC-3","doc"),E("d_irp","ct_IR-4","doc"),E("d_irp","ct_AU-9","doc"),
  ];
  return {nodes:[...conns,...evs,...ctrls,...docs],edges};
}
function layoutGraph(nodes){
  const by={document:[],connector:[],evidence:[],control:[]};nodes.forEach(n=>by[n.type]&&by[n.type].push(n));
  const R={document:300,connector:230,evidence:140,control:62};
  Object.entries(by).forEach(([t,ns])=>{const rad=R[t];ns.forEach((n,i)=>{
    const phi=Math.acos(1-2*(i+.5)/Math.max(ns.length,1)),th=Math.PI*(1+Math.sqrt(5))*i;
    n.x=rad*Math.sin(phi)*Math.cos(th);n.y=rad*Math.sin(phi)*Math.sin(th);n.z=rad*Math.cos(phi);n.vx=n.vy=n.vz=0;});});
}
function simGraph(nodes,edges,idx,steps){
  for(let s=0;s<steps;s++){const k=.018*(1-s/steps);

// Mirrors the backend ai_governance.compute_privacy_risk exactly, so the dashboard
// shows the same dynamic residual the API computes.
const PET_DEFS=[
  {id:"differential_privacy",label:"Differential Privacy",param:"epsilon",
   desc:"Prevents inference about any single individual"},
  {id:"homomorphic_encryption",label:"Homomorphic Encryption",param:"scheme",
   desc:"Computation on encrypted data — plaintext never exposed"},
  {id:"federated_learning",label:"Federated Learning",param:null,
   desc:"Training data never leaves its source"},
  {id:"secure_mpc",label:"Secure Multi-Party Computation",param:null,
   desc:"No party sees others' raw inputs"},
  {id:"k_anonymity",label:"k-Anonymity",param:"k",
   desc:"Each record indistinguishable among k-1 others"},
  {id:"synthetic_data",label:"Synthetic Data",param:null,
   desc:"Generated data, not real subjects"},
  {id:"data_minimization",label:"Data Minimization",param:null,
   desc:"Only strictly necessary data collected"},
];
const SENSITIVITY={none:5,internal:20,pii:60,financial:75,phi:80,biometric:90,special_category:95};
function assessPET(id,params){
  params=params||{};let eff=0.5,note="present";
  if(id==="differential_privacy"){const e=parseFloat(params.epsilon);
    if(isNaN(e))[eff,note]=[0.4,"no ε budget set"];
    else if(e<1)[eff,note]=[0.95,`strong (ε=${e})`];
    else if(e<=10)[eff,note]=[0.65,`moderate (ε=${e})`];
    else [eff,note]=[0.3,`weak (ε=${e})`];}
  else if(id==="homomorphic_encryption"){const s=(params.scheme||"").toUpperCase();
    if(["CKKS","BFV","BGV","TFHE","FHE"].includes(s))[eff,note]=[0.9,`${s} fully homomorphic`];
    else if(["PAILLIER","RSA","PHE"].includes(s))[eff,note]=[0.6,`${s} partially homomorphic`];
    else [eff,note]=[0.5,"scheme unspecified"];}
  else if(id==="k_anonymity"){const k=parseFloat(params.k);
    if(isNaN(k))[eff,note]=[0.4,"k not set"];
    else if(k>=10)[eff,note]=[0.8,`strong (k=${k})`];
    else if(k>=3)[eff,note]=[0.55,`moderate (k=${k})`];
    else [eff,note]=[0.25,`weak (k=${k})`];}
  else if(id==="federated_learning"||id==="secure_mpc")[eff,note]=[0.85,"raw data never centralized"];
  else if(id==="synthetic_data")[eff,note]=[0.8,"no real subjects"];
  else if(id==="data_minimization")[eff,note]=[0.5,"scope-limited"];
  return {eff,note};
}
function computePrivacyRisk(sensitivity,active){
  const inherent=SENSITIVITY[sensitivity]||40;
  let remaining=1;const assessed=[];
  active.forEach(a=>{const r=assessPET(a.id,a.params);remaining*=(1-r.eff);assessed.push({...a,...r});});
  const mitigation=1-remaining;
  const floor=Math.round(inherent*0.08);
  const residual=Math.max(Math.round(inherent*remaining),floor);
  const band=residual<25?"low":residual<50?"medium":residual<75?"high":"critical";
  return {inherent,mitigation:Math.round(mitigation*100),residual,band,assessed};
}

  const m=main(),v=view("Risk Register","Identify, score, treat and monitor enterprise risks — likelihood × impact with treatment decisions");
  m.appendChild(v);const host=el("div");v.appendChild(host);
  host.innerHTML=`<div class="empty"><span class="spin"></span> Loading risks…</div>`;
  const {data}=await load(withTenant("/grc/risks"),DEMO_RISKS);
  RISK.rows=Array.isArray(data)?data:[];
  renderRisks(host);
};

function renderRisks(host){
  const rows=RISK.rows||[];host.innerHTML="";
  // KPIs
  const bands={critical:0,high:0,medium:0,low:0};let overdue=0;const now=Date.now();
  rows.forEach(r=>{bands[r.inherent_band]=(bands[r.inherent_band]||0)+1;if(r.review_date&&new Date(r.review_date)<now)overdue++;});
  const kp=el("div","kpis");
  [["Total risks",rows.length,"in register","var(--hi)"],["🔴 Critical",bands.critical,"need action","var(--fail)"],
   ["🟠 High",bands.high,"elevated","var(--warn)"],["⏰ Overdue reviews",overdue,"past review date",overdue?"var(--fail)":"var(--pass)"]]
   .forEach(([k,n,s,c])=>{const e=el("div","kpi");e.style.setProperty("--accent",c);e.innerHTML=`<div class="k">${k}</div><div class="v">${n}</div><div class="s">${s}</div>`;kp.appendChild(e);});
  host.appendChild(kp);

  // ── RISK MATRIX 5×5 + category/band breakdown ──
  const rcharts=el("div");rcharts.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px";
  const matrixRisks=rows.map(r=>({
    likelihood:r.likelihood||Math.min(5,Math.max(1,Math.round((r.inherent_score||9)/5))),
    impact:r.impact||Math.min(5,Math.max(1,Math.round((r.inherent_score||9)/5))),
    title:r.title}));
  rcharts.innerHTML=chartCard("Risk matrix","Likelihood x impact - bubble size = risks in that cell",svgRiskMatrix(matrixRisks));
  const byCat={};rows.forEach(r=>{const cc=(r.category||"other").replace(/_/g," ");byCat[cc]=(byCat[cc]||0)+1;});
  const catData=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value,color:CHART_COL.hi}));
  const bandData=[["critical",CHART_COL.fail],["high","#fb923c"],["medium",CHART_COL.warn],["low",CHART_COL.pass]]
    .map(([b,cl])=>({label:b,value:bands[b]||0,color:cl}));
  const catCard=el("div","card");
  catCard.innerHTML=`<h3>Risk distribution</h3><div class="sub" style="margin-bottom:14px">By inherent severity band and category</div>
    ${svgDonut(bandData,{size:150,center:rows.length,centerLabel:"risks"})}
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">By category</div>${catData.length?svgBars(catData,{barH:22,width:380,labelW:110}):'<div class="empty">no data</div>'}</div>`;
  rcharts.appendChild(catCard);
  host.appendChild(rcharts);


  // lifecycle pipeline
  const pipe=el("div","card");
  pipe.innerHTML=`<h3>Risk lifecycle</h3><div class="sub">Risks flow from identification to closure</div>`;
  const stages=el("div");stages.style.cssText="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap";
  RISK_STAGES.forEach(([id,label],i)=>{
    const n=rows.filter(r=>r.status===id).length;
    const seg=el("div");seg.style.cssText="flex:1;min-width:120px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;position:relative";
    seg.innerHTML=`<div style="font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.4px">${label}</div>
      <div style="font-size:22px;font-weight:700;margin-top:4px">${n}</div>
      ${i<RISK_STAGES.length-1?'<div style="position:absolute;right:-6px;top:50%;color:var(--mid);font-size:14px">→</div>':''}`;
    stages.appendChild(seg);
  });
  pipe.appendChild(stages);host.appendChild(pipe);

  // register table + add button
  const card=el("div","card");
  const head=el("div");head.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
  head.innerHTML=`<div><h3 style="margin:0">Risk register</h3><div class="sub" style="margin:0">${rows.length} risks · sorted by inherent score</div></div>`;
  const addBtn=el("button","btn primary sm");addBtn.textContent="+ Add risk";addBtn.onclick=()=>openRiskModal(host);
  head.appendChild(addBtn);card.appendChild(head);
  const wrap=el("div","scroll");
  if(!rows.length){wrap.innerHTML=`<div class="empty">No risks yet. Click "+ Add risk" to start your register.</div>`;}
  else{wrap.innerHTML=`<table><thead><tr><th>Risk</th><th>Category</th><th>Owner</th><th>Inherent</th><th>Residual</th><th>Treatment</th><th>Status</th><th>Review</th><th></th></tr></thead><tbody>${
    rows.map(r=>{const ib=RISK_BAND[r.inherent_band]||["b-dim"],rb=RISK_BAND[r.residual_band]||["b-dim"];
      const od=r.review_date&&new Date(r.review_date)<now;
      return `<tr><td>${esc(r.title)}</td><td>${esc((r.category||"").replace(/_/g," "))}</td><td>${esc(r.owner||"—")}</td>
        <td><span class="badge ${ib[0]}">${r.inherent_score} ${r.inherent_band}</span></td>
        <td><span class="badge ${rb[0]}">${r.residual_score}</span></td>
        <td><span class="badge b-dim">${esc(r.treatment)}</span></td>
        <td><span class="badge b-hi">${esc((r.status||"").replace(/_/g," "))}</span></td>
        <td class="mono" style="color:${od?'var(--fail)':'var(--mid)'};font-size:11px">${r.review_date?new Date(r.review_date).toLocaleDateString():"—"}${od?" ⚠":""}</td>
        <td><button class="btn sm" data-rid="${r.id}" style="padding:3px 8px">Edit</button></td></tr>`;}).join("")}</tbody></table>`;}
  card.appendChild(wrap);host.appendChild(card);
  wrap.querySelectorAll("[data-rid]").forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.rid);openRiskModal(host,r);});
}

function openRiskModal(host,risk){
  const ex=risk||{};
  const modal=el("div","modal on");
  modal.innerHTML=`<div class="box" style="width:480px">
    <h3>${risk?"Edit risk":"Add risk"}</h3>
    <div class="fld"><label>Title</label><input id="rk_title" value="${esc(ex.title||"")}"/></div>
    <div class="fld"><label>Owner</label><input id="rk_owner" value="${esc(ex.owner||"")}"/></div>
    <div style="display:flex;gap:10px">
      <div class="fld" style="flex:1"><label>Likelihood (1-5)</label><input id="rk_like" type="number" min="1" max="5" value="${ex.likelihood||3}"/></div>
      <div class="fld" style="flex:1"><label>Impact (1-5)</label><input id="rk_imp" type="number" min="1" max="5" value="${ex.impact||3}"/></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="fld" style="flex:1"><label>Treatment</label><select id="rk_treat" style="width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:9px;color:var(--txt)">
        ${["mitigate","accept","transfer","avoid"].map(t=>`<option ${ex.treatment===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="fld" style="flex:1"><label>Status</label><select id="rk_status" style="width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:9px;color:var(--txt)">
        ${["identified","assessed","treated","monitoring","closed"].map(s=>`<option ${ex.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn primary" id="rk_save" style="flex:1">${risk?"Save changes":"Add risk"}</button>
      ${risk?'<button class="btn" id="rk_del" style="color:var(--fail)">Delete</button>':''}
      <button class="btn" id="rk_cancel">Cancel</button>
    </div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  modal.addEventListener("click",e=>{if(e.target===modal)close();});
  modal.querySelector("#rk_cancel").onclick=close;
  modal.querySelector("#rk_save").onclick=async()=>{
    const body={title:modal.querySelector("#rk_title").value.trim(),owner:modal.querySelector("#rk_owner").value.trim(),
      likelihood:+modal.querySelector("#rk_like").value,impact:+modal.querySelector("#rk_imp").value,
      treatment:modal.querySelector("#rk_treat").value,status:modal.querySelector("#rk_status").value};
    if(!body.title){toast("Title required");return;}
    if(STATE.mode==="demo"){
      const sc=body.likelihood*body.impact,band=sc>=20?"critical":sc>=12?"high":sc>=6?"medium":"low";
      if(risk)Object.assign(risk,body,{inherent_score:sc,inherent_band:band,residual_score:sc,residual_band:band});
      else RISK.rows.unshift({id:"r"+Date.now(),...body,inherent_score:sc,inherent_band:band,residual_score:sc,residual_band:band,review_date:null});
      close();renderRisks(host);toast(risk?"Risk updated":"Risk added");return;}
    try{if(risk){await apiPATCH("/grc/risks/"+risk.id,body);}else{await apiPOST(withTenant("/grc/risks"),body);}
      RISK.rows=await apiGET(withTenant("/grc/risks"));close();renderRisks(host);toast(risk?"Risk updated":"Risk added");
    }catch(e){toast("Error: "+e.message);}};
  if(risk){modal.querySelector("#rk_del").onclick=async()=>{
    if(STATE.mode==="demo"){RISK.rows=RISK.rows.filter(x=>x.id!==risk.id);close();renderRisks(host);toast("Risk deleted");return;}
    try{await apiDELETE("/grc/risks/"+risk.id);RISK.rows=await apiGET(withTenant("/grc/risks"));close();renderRisks(host);toast("Risk deleted");}catch(e){toast("Error: "+e.message);}};}
}

/* ============ TPRM VENDORS (Vanta/Drata/OneTrust style) ============ */
const VENDOR_STAGES=[["onboarding","Onboarding"],["assessment","Assessment"],["active","Active"],["offboarding","Offboarding"]];
const VRISK_BAND={critical:["b-fail"],high:["b-warn"],medium:["b-info"],low:["b-pass"]};
const ASSESS_BADGE={not_started:["b-dim","Not started"],sent:["b-info","Sent"],in_review:["b-warn","In review"],approved:["b-pass","Approved"],flagged:["b-fail","Flagged"]};
const DEMO_VENDORS=[
  {id:"v1",name:"Amazon Web Services",category:"cloud",stage:"active",risk_tier:"high",assessment_state:"approved",assessment_score:94,computed_risk:"low",data_access:"financial",has_dpa:true,has_soc2:true,next_review:new Date(Date.now()+120*864e5).toISOString()},
  {id:"v2",name:"Okta",category:"identity",stage:"active",risk_tier:"high",assessment_state:"approved",assessment_score:88,computed_risk:"low",data_access:"pii",has_dpa:true,has_soc2:true,next_review:new Date(Date.now()+90*864e5).toISOString()},
  {id:"v3",name:"DataPipe Analytics",category:"analytics",stage:"assessment",risk_tier:"high",assessment_state:"flagged",assessment_score:38,computed_risk:"critical",data_access:"pii",has_dpa:false,has_soc2:false,next_review:new Date(Date.now()-3*864e5).toISOString()},
  {id:"v4",name:"Slack",category:"collaboration",stage:"active",risk_tier:"medium",assessment_state:"approved",assessment_score:79,computed_risk:"medium",data_access:"pii",has_dpa:true,has_soc2:true,next_review:new Date(Date.now()+150*864e5).toISOString()},
  {id:"v5",name:"FreshMailer",category:"marketing",stage:"onboarding",risk_tier:"medium",assessment_state:"sent",assessment_score:null,computed_risk:"medium",data_access:"pii",has_dpa:false,has_soc2:false,next_review:null},
  {id:"v6",name:"LegacyBackup Co",category:"infrastructure",stage:"offboarding",risk_tier:"low",assessment_state:"approved",assessment_score:62,computed_risk:"medium",data_access:"none",has_dpa:true,has_soc2:false,next_review:null},
];
const VND={rows:null};

RENDER.vendors = async function(){
  const m=main(),v=view("Third-Party Risk (TPRM)","Vendor lifecycle from onboarding through assessment, monitoring and offboarding");
  m.appendChild(v);const host=el("div");v.appendChild(host);
  host.innerHTML=`<div class="empty"><span class="spin"></span> Loading vendors…</div>`;
  const {data}=await load(withTenant("/tprm/vendors"),DEMO_VENDORS);
  VND.rows=Array.isArray(data)?data:[];
  renderVendors(host);
};

function renderVendors(host){
  const rows=VND.rows||[];host.innerHTML="";
  const risk={critical:0,high:0,medium:0,low:0};let needsAssess=0,missingDpa=0,overdue=0;const now=Date.now();
  rows.forEach(v=>{risk[v.computed_risk]=(risk[v.computed_risk]||0)+1;
    if(["not_started","sent"].includes(v.assessment_state))needsAssess++;
    if(["pii","phi","financial"].includes(v.data_access)&&!v.has_dpa)missingDpa++;
    if(v.next_review&&new Date(v.next_review)<now)overdue++;});
  const kp=el("div","kpis");
  [["Total vendors",rows.length,"tracked","var(--hi)"],["🔴 Critical risk",risk.critical,"need attention","var(--fail)"],
   ["📋 Need assessment",needsAssess,"not yet approved","var(--warn)"],["⚠ Missing DPA",missingDpa,"PII without agreement",missingDpa?"var(--fail)":"var(--pass)"]]
   .forEach(([k,n,s,c])=>{const e=el("div","kpi");e.style.setProperty("--accent",c);e.innerHTML=`<div class="k">${k}</div><div class="v">${n}</div><div class="s">${s}</div>`;kp.appendChild(e);});
  host.appendChild(kp);

  // lifecycle pipeline
  const pipe=el("div","card");
  pipe.innerHTML=`<h3>Vendor lifecycle</h3><div class="sub">Vendors progress through onboarding to offboarding</div>`;
  const stages=el("div");stages.style.cssText="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap";
  VENDOR_STAGES.forEach(([id,label],i)=>{
    const vs=rows.filter(v=>v.stage===id);
    const seg=el("div");seg.style.cssText="flex:1;min-width:130px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;position:relative";
    seg.innerHTML=`<div style="font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.4px">${label}</div>
      <div style="font-size:22px;font-weight:700;margin-top:4px">${vs.length}</div>
      <div style="font-size:11px;color:var(--mid);margin-top:2px">${vs.slice(0,2).map(v=>esc(v.name)).join(", ")||"—"}</div>
      ${i<VENDOR_STAGES.length-1?'<div style="position:absolute;right:-6px;top:50%;color:var(--mid)">→</div>':''}`;
    stages.appendChild(seg);
  });
  pipe.appendChild(stages);host.appendChild(pipe);

  // register
  const card=el("div","card");
  const head=el("div");head.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
  head.innerHTML=`<div><h3 style="margin:0">Vendor register</h3><div class="sub" style="margin:0">${rows.length} vendors</div></div>`;
  const addBtn=el("button","btn primary sm");addBtn.textContent="+ Add vendor";addBtn.onclick=()=>openVendorModal(host);
  head.appendChild(addBtn);card.appendChild(head);
  const wrap=el("div","scroll");
  if(!rows.length){wrap.innerHTML=`<div class="empty">No vendors yet. Click "+ Add vendor" to start.</div>`;}
  else{wrap.innerHTML=`<table><thead><tr><th>Vendor</th><th>Category</th><th>Stage</th><th>Risk</th><th>Assessment</th><th>Data</th><th>DPA</th><th>Review</th><th></th></tr></thead><tbody>${
    rows.map(v=>{const rb=VRISK_BAND[v.computed_risk]||["b-dim"],as=ASSESS_BADGE[v.assessment_state]||["b-dim",v.assessment_state];
      const od=v.next_review&&new Date(v.next_review)<now;const dpaGap=["pii","phi","financial"].includes(v.data_access)&&!v.has_dpa;
      return `<tr><td>${esc(v.name)}</td><td>${esc(v.category||"—")}</td>
        <td><span class="badge b-hi">${esc(v.stage)}</span></td>
        <td><span class="badge ${rb[0]}">${esc(v.computed_risk)}${v.assessment_score!=null?" ("+v.assessment_score+")":""}</span></td>
        <td><span class="badge ${as[0]}">${as[1]}</span></td>
        <td class="mono" style="font-size:11px">${esc(v.data_access||"none")}</td>
        <td>${v.has_dpa?'<span class="badge b-pass">yes</span>':(dpaGap?'<span class="badge b-fail">missing ⚠</span>':'<span class="badge b-dim">n/a</span>')}</td>
        <td class="mono" style="color:${od?'var(--fail)':'var(--mid)'};font-size:11px">${v.next_review?new Date(v.next_review).toLocaleDateString():"—"}${od?" ⚠":""}</td>
        <td><button class="btn sm" data-vid="${v.id}" style="padding:3px 8px">Edit</button></td></tr>`;}).join("")}</tbody></table>`;}
  card.appendChild(wrap);host.appendChild(card);
  wrap.querySelectorAll("[data-vid]").forEach(b=>b.onclick=()=>{const v=rows.find(x=>x.id===b.dataset.vid);openVendorModal(host,v);});
}

function openVendorModal(host,vendor){
  const ex=vendor||{};
  const modal=el("div","modal on");
  const sel=(id,opts,cur)=>`<select id="${id}" style="width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:9px;color:var(--txt)">${opts.map(o=>`<option ${cur===o?"selected":""}>${o}</option>`).join("")}</select>`;
  modal.innerHTML=`<div class="box" style="width:500px">
    <h3>${vendor?"Edit vendor":"Add vendor"}</h3>
    <div class="fld"><label>Name</label><input id="vn_name" value="${esc(ex.name||"")}"/></div>
    <div style="display:flex;gap:10px">
      <div class="fld" style="flex:1"><label>Category</label><input id="vn_cat" value="${esc(ex.category||"")}"/></div>
      <div class="fld" style="flex:1"><label>Stage</label>${sel("vn_stage",["onboarding","assessment","active","offboarding","terminated"],ex.stage||"onboarding")}</div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="fld" style="flex:1"><label>Risk tier</label>${sel("vn_tier",["critical","high","medium","low"],ex.risk_tier||"medium")}</div>
      <div class="fld" style="flex:1"><label>Assessment</label>${sel("vn_assess",["not_started","sent","in_review","approved","flagged"],ex.assessment_state||"not_started")}</div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="fld" style="flex:1"><label>Score (0-100)</label><input id="vn_score" type="number" min="0" max="100" value="${ex.assessment_score!=null?ex.assessment_score:""}"/></div>
      <div class="fld" style="flex:1"><label>Data access</label>${sel("vn_data",["none","pii","phi","financial"],ex.data_access||"none")}</div>
    </div>
    <div class="fld"><label>Linked connector (ties live telemetry to this vendor)</label>
      <select id="vn_conn" style="width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:9px;color:var(--txt)">
        <option value="">— none —</option>
        ${(MKT.rows||DEMO_CONNECTORS).map(co=>`<option value="${co.key}" ${ex.linked_connector_key===co.key?"selected":""}>${esc(co.name)}</option>`).join("")}</select></div>
    <div style="display:flex;gap:18px;margin-bottom:10px">
      <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="vn_dpa" ${ex.has_dpa?"checked":""}/> Has DPA</label>
      <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="vn_soc2" ${ex.has_soc2?"checked":""}/> Has SOC 2</label>
    </div>
    <div style="display:flex;gap:9px;margin-top:8px">
      <button class="btn primary" id="vn_save" style="flex:1">${vendor?"Save changes":"Add vendor"}</button>
      ${vendor?'<button class="btn" id="vn_del" style="color:var(--fail)">Delete</button>':''}
      <button class="btn" id="vn_cancel">Cancel</button>
    </div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  modal.addEventListener("click",e=>{if(e.target===modal)close();});
  modal.querySelector("#vn_cancel").onclick=close;
  const band=(sc,tier)=>sc==null?tier:sc>=85?"low":sc>=65?"medium":sc>=40?"high":"critical";
  modal.querySelector("#vn_save").onclick=async()=>{
    const sc=modal.querySelector("#vn_score").value;
    const body={name:modal.querySelector("#vn_name").value.trim(),category:modal.querySelector("#vn_cat").value.trim(),
      stage:modal.querySelector("#vn_stage").value,risk_tier:modal.querySelector("#vn_tier").value,
      assessment_state:modal.querySelector("#vn_assess").value,data_access:modal.querySelector("#vn_data").value,
      has_dpa:modal.querySelector("#vn_dpa").checked,has_soc2:modal.querySelector("#vn_soc2").checked,
      linked_connector_key:modal.querySelector("#vn_conn").value||null,
      assessment_score:sc===""?null:+sc};
    if(!body.name){toast("Name required");return;}
    if(STATE.mode==="demo"){
      const cr=band(body.assessment_score,body.risk_tier);
      if(vendor)Object.assign(vendor,body,{computed_risk:cr});
      else VND.rows.unshift({id:"v"+Date.now(),...body,computed_risk:cr,next_review:null});
      close();renderVendors(host);toast(vendor?"Vendor updated":"Vendor added");return;}
    try{if(vendor){await apiPATCH("/tprm/vendors/"+vendor.id,body);}else{await apiPOST(withTenant("/tprm/vendors"),body);}
      VND.rows=await apiGET(withTenant("/tprm/vendors"));close();renderVendors(host);toast(vendor?"Vendor updated":"Vendor added");
    }catch(e){toast("Error: "+e.message);}};
  if(vendor){modal.querySelector("#vn_del").onclick=async()=>{
    if(STATE.mode==="demo"){VND.rows=VND.rows.filter(x=>x.id!==vendor.id);close();renderVendors(host);toast("Vendor deleted");return;}
    try{await apiDELETE("/tprm/vendors/"+vendor.id);VND.rows=await apiGET(withTenant("/tprm/vendors"));close();renderVendors(host);toast("Vendor deleted");}catch(e){toast("Error: "+e.message);}};}
}

function tgLayout(){
  // layer by type along x: vendor -> connector -> control -> risk
  const layers={vendor:-260,connector:-90,control:90,risk:260};
  const byType={vendor:[],connector:[],control:[],risk:[]};
  TG.nodes.forEach(n=>byType[n.type]&&byType[n.type].push(n));
  Object.entries(byType).forEach(([t,arr])=>{arr.forEach((n,i)=>{
    const ang=arr.length>1?(i/(arr.length-1)-.5):0;
    n.x=layers[t];n.y=ang*260;n.z=Math.sin(i*1.7)*60;n.vx=n.vy=n.vz=0;});});
}
function tgSim(steps){for(let s=0;s<steps;s++){const k=.02*(1-s/steps);
  TG.edges.forEach(e=>{const a=TG.idx[e.from],b=TG.idx[e.to];if(!a||!b)return;
    const dy=b.y-a.y,dz=b.z-a.z,f=k*.3;a.vy+=f*dy;a.vz+=f*dz;b.vy-=f*dy;b.vz-=f*dz;});
  for(let i=0;i<TG.nodes.length;i++)for(let j=i+1;j<TG.nodes.length;j++){const a=TG.nodes[i],b=TG.nodes[j];
    if(a.type!==b.type)continue;const dy=a.y-b.y,dz=a.z-b.z,d2=dy*dy+dz*dz+1,f=180/d2;a.vy+=f*dy/Math.sqrt(d2);a.vz+=f*dz/Math.sqrt(d2);b.vy-=f*dy/Math.sqrt(d2);b.vz-=f*dz/Math.sqrt(d2);}
  TG.nodes.forEach(n=>{n.y+=n.vy*.1;n.z+=n.vz*.1;n.vy*=.7;n.vz*=.7;});}}
function tgProj(n,W,H){const cx=Math.cos(TG.rotX),sx=Math.sin(TG.rotX),cy=Math.cos(TG.rotY),sy=Math.sin(TG.rotY);
  const y1=n.y*cx-n.z*sx,z1=n.y*sx+n.z*cx,x2=n.x*cy+z1*sy,z2=-n.x*sy+z1*cy,fov=340*TG.zoom,z=z2+440;
  return{x:W/2+x2*fov/z,y:H/2+y1*fov/z,z:z2,sc:fov/z};}
function tgDraw(){const cv=TG.cv,x=TG.ctx;if(!cv||!x)return;const W=cv._w,H=cv._h;x.clearRect(0,0,W,H);
  const pm={};TG.nodes.forEach(n=>pm[n.id]=tgProj(n,W,H));
  TG.edges.forEach(e=>{const a=pm[e.from],b=pm[e.to];if(!a||!b)return;
    const hl=TG.sel&&(e.from===TG.sel||e.to===TG.sel),hh=TG.hov&&(e.from===TG.hov||e.to===TG.hov);
    const st=e.strength==null?1:e.strength;const al=hl?.9:hh?.6:.2+st*.3;
    const col=e.kind==="operates"?`rgba(167,139,250,${al})`:e.kind==="evidences"?`rgba(91,156,246,${al})`:e.kind==="mitigates"?`rgba(52,211,153,${al})`:`rgba(248,113,113,${al})`;
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.strokeStyle=col;x.lineWidth=e.kind==="mitigates"&&st>=1?2.2:1.1;
    if(e.kind==="mitigates"&&st<0.3)x.setLineDash([4,4]);x.stroke();x.setLineDash([]);});
  const sorted=TG.nodes.map(n=>({n,p:pm[n.id]})).sort((a,b)=>a.p.z-b.p.z);
  sorted.forEach(({n,p})=>{const r=(n.type==="risk"?9:n.type==="vendor"?9:7)*p.sc*1.6,hi=TG.hov===n.id||TG.sel===n.id;
    let col=TG_COLORS[n.type];let faded=(n.type==="control"&&n.status==="unevidenced")||(n.type==="risk"&&(n.strength||0)===0&&n.residual===n.inherent);
    if(hi){x.beginPath();x.arc(p.x,p.y,r+5,0,7);x.fillStyle="rgba(255,255,255,.1)";x.fill();}
    x.beginPath();x.arc(p.x,p.y,r,0,7);x.fillStyle=col+(faded?"44":hi?"ff":"cc");x.fill();
    x.strokeStyle="rgba(255,255,255,.2)";x.lineWidth=.7;x.stroke();
    if(r>5||hi){x.font=`${Math.min(11,r*.8+6)}px ui-monospace,monospace`;x.fillStyle=hi?"#fff":faded?"rgba(180,190,210,.5)":"rgba(220,230,255,.75)";x.textAlign="center";
      let lbl=n.label.length>16?n.label.slice(0,15)+"…":n.label;x.fillText(lbl,p.x,p.y+r+11);}});
}
function tgHit(mx,my){const cv=TG.cv;if(!cv)return null;const W=cv._w,H=cv._h;let best=null,bd=1e9;
  TG.nodes.forEach(n=>{const p=tgProj(n,W,H),r=(n.type==="risk"?9:7)*p.sc*1.6+5,d=Math.hypot(mx-p.x,my-p.y);if(d<r&&d<bd){bd=d;best=n;}});return best;}
function tgInfo(n){const panel=$("#tginfo");if(!panel)return;if(!n){panel.style.display="none";return;}
  const ins=TG.edges.filter(e=>e.to===n.id).map(e=>(TG.idx[e.from]||{}).label||e.from);
  const outs=TG.edges.filter(e=>e.from===n.id).map(e=>(TG.idx[e.to]||{}).label||e.to);
  let detail="";
  if(n.type==="risk")detail=`<div style="margin-top:5px">Inherent: <b style="color:var(--txt)">${n.inherent}</b> → Residual: <b style="color:${n.residual<n.inherent?'var(--pass)':'var(--fail)'}">${n.residual}</b></div><div style="font-size:11px">evidence strength: ${((n.strength||0)*100).toFixed(0)}%</div>`;
  if(n.type==="control")detail=`<div style="margin-top:5px">status: <b style="color:${n.status==='evidenced'?'var(--pass)':n.status==='weak'?'var(--warn)':'var(--fail)'}">${n.status}</b></div>`;
  if(n.type==="connector")detail=`<div style="margin-top:5px">${n.live?'<span style="color:var(--pass)">● live</span>':'<span style="color:var(--mid)">○ not live</span>'}${n.fresh?' · fresh':''}</div>`;
  panel.style.display="block";
  panel.innerHTML=`<div style="color:var(--txt);font-weight:600;font-size:12.5px">${esc(n.label)}</div>
    <div style="color:var(--mid);font-size:10px;text-transform:uppercase;letter-spacing:.5px">${n.type}</div>${detail}
    ${ins.length?`<div style="margin-top:6px;font-size:11px"><span style="color:var(--mid)">← from: </span>${ins.slice(0,3).map(esc).join(", ")}</div>`:""}
    ${outs.length?`<div style="margin-top:3px;font-size:11px"><span style="color:var(--mid)">→ to: </span>${outs.slice(0,3).map(esc).join(", ")}</div>`:""}`;
}

const CMD_ACTIONS=()=>{
  const navItems=[];
  GROUPS.forEach(([grp,tabs])=>tabs.forEach(([id,name])=>navItems.push({type:"nav",id,label:name,group:grp,kw:(name+" "+grp).toLowerCase()})));
  const actions=[

    {type:"act",label:"Export OSCAL (JSON)",group:"Export",kw:"export oscal json nist machine",run:()=>downloadReport("oscal")},
    {type:"act",label:"Connection settings",group:"Settings",kw:"settings connect api key tenant",run:()=>openSettings()},
    {type:"act",label:"Run your own instance",group:"Help",kw:"self host deploy clone run own instance",run:()=>openSelfHost()},
    {type:"act",label:"Toggle live / demo mode",group:"Settings",kw:"demo live toggle mode data",run:()=>{STATE.mode==="demo"?detectMode().then(render):useDemoMode();}},
  ];
  return [...navItems,...actions];
};
const CMDK={open:false,q:"",sel:0,items:[]};
function openCmdK(){CMDK.open=true;CMDK.q="";CMDK.sel=0;CMDK.items=CMD_ACTIONS();
  $("#cmdk").classList.add("on");const inp=$("#cmdkInput");inp.value="";inp.focus();renderCmdK();}
function closeCmdK(){CMDK.open=false;$("#cmdk").classList.remove("on");}
function cmdkFiltered(){const q=CMDK.q.trim().toLowerCase();
  if(!q)return CMDK.items;
  return CMDK.items.filter(i=>i.kw.includes(q)||i.label.toLowerCase().includes(q));}
function renderCmdK(){
  const list=$("#cmdkList"),items=cmdkFiltered();
  if(CMDK.sel>=items.length)CMDK.sel=Math.max(0,items.length-1);
  if(!items.length){list.innerHTML=`<div class="cmd-empty">No matches for "${esc(CMDK.q)}"</div>`;return;}
  list.innerHTML=items.map((it,i)=>`<div class="cmd-item${i===CMDK.sel?" sel":""}" data-i="${i}">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${it.type==="nav"?"M9 5l7 7-7 7":"M13 2L3 14h7l-1 8 10-12h-7l1-8z"}"/></svg>
    <span class="lbl">${esc(it.label)}</span><span class="grp">${esc(it.group)}</span></div>`).join("");
  list.querySelectorAll(".cmd-item").forEach(el=>{
    el.onmouseenter=()=>{CMDK.sel=+el.dataset.i;renderCmdK();};
    el.onclick=()=>runCmdK(items[+el.dataset.i]);});
}
function runCmdK(it){closeCmdK();if(!it)return;
  if(it.type==="nav"){STATE.active=it.id;buildNav();render();window.scrollTo(0,0);}
  else if(it.run)it.run();}
function cmdkKey(e){
  if(!CMDK.open)return;
  const items=cmdkFiltered();
  if(e.key==="ArrowDown"){e.preventDefault();CMDK.sel=Math.min(CMDK.sel+1,items.length-1);renderCmdK();}
  else if(e.key==="ArrowUp"){e.preventDefault();CMDK.sel=Math.max(CMDK.sel-1,0);renderCmdK();}
  else if(e.key==="Enter"){e.preventDefault();runCmdK(items[CMDK.sel]);}
  else if(e.key==="Escape"){closeCmdK();}
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();CMDK.open?closeCmdK():openCmdK();}
  else cmdkKey(e);
});

async function downloadReport(kind){
  if(STATE.mode==="demo"){
    toast("Connect to live API to export real reports (demo has no data to export)");
    return;
  }
  toast("Generating "+kind.toUpperCase()+" report…");
  try{
    const url=CFG.base.replace(/\/$/,"")+"/reports/"+kind+"?tenant_id="+encodeURIComponent(CFG.tenant);
    const headers={};if(CFG.key)headers["X-API-Key"]=CFG.key;
    const r=await fetch(url,{headers});
    if(!r.ok)throw new Error("HTTP "+r.status);
    if(kind==="oscal"){const j=await r.json();dlBlob(JSON.stringify(j,null,2),"application/json","compliance_oscal.json");}
    else{const b=await r.blob();dlBlob(b,kind==="pdf"?"application/pdf":"text/csv","compliance_"+CFG.tenant+"."+kind);}
    toast(kind.toUpperCase()+" report downloaded");
  }catch(e){toast("Export failed: "+e.message);}
}
function dlBlob(content,mime,filename){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
}
function exportMenu(anchor){
  document.querySelectorAll(".exp-menu.on").forEach(m=>m.classList.remove("on"));
  let menu=anchor.querySelector(".exp-menu");
  if(menu){menu.classList.toggle("on");return;}
  menu=el("div","exp-menu on");
  menu.innerHTML=`
    <div class="opt" data-k="pdf"><span>📄</span><div><div>PDF report</div><div class="d">auditor-ready summary</div></div></div>
    <div class="opt" data-k="csv"><span>📊</span><div><div>CSV findings</div><div class="d">all findings, spreadsheet</div></div></div>
    <div class="opt" data-k="oscal"><span>🔖</span><div><div>OSCAL JSON</div><div class="d">NIST machine-readable</div></div></div>`;
  anchor.appendChild(menu);
  menu.querySelectorAll(".opt").forEach(o=>o.onclick=ev=>{ev.stopPropagation();menu.classList.remove("on");downloadReport(o.dataset.k);});
}
document.addEventListener("click",e=>{if(!e.target.closest(".exp-btn"))document.querySelectorAll(".exp-menu.on").forEach(m=>m.classList.remove("on"));});

RENDER.documents=async function(){
  const m=main(),v=view("Document Ingestion","Drop in a policy PDF or security doc — Comp-Lens extracts the controls it evidences and feeds them into telemetry");
  m.appendChild(v);const host=el("div");v.appendChild(host);

  const dz=el("div","card");
  dz.innerHTML=`<h3>Ingest a compliance document</h3><div class="sub">Paste text or drop a file — we convert to markdown, extract controls, and emit evidence events</div>`;
  const drop=el("div","dropzone");
  drop.innerHTML=`<div class="big">Drop a document here</div><div class="sm">PDF, text, or markdown · or paste below</div>`;
  const fileInput=el("input");fileInput.type="file";fileInput.style.display="none";fileInput.accept=".pdf,.txt,.md";
  dz.appendChild(drop);dz.appendChild(fileInput);
  const ta=el("textarea");ta.placeholder="…or paste document text here (e.g. an InfoSec policy)";
  ta.style.cssText="width:100%;min-height:120px;margin-top:12px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:12px;color:var(--txt);font-family:inherit;font-size:13px;resize:vertical";
  dz.appendChild(ta);
  const btn=el("button","btn primary");btn.textContent="Extract controls";btn.style.marginTop="12px";
  dz.appendChild(btn);host.appendChild(dz);
  const resHost=el("div");host.appendChild(resHost);

  drop.onclick=()=>fileInput.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag");};
  drop.ondragleave=()=>drop.classList.remove("drag");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");const f=e.dataTransfer.files[0];if(f)handleFile(f);};
  fileInput.onchange=()=>{if(fileInput.files[0])handleFile(fileInput.files[0]);};
  function handleFile(f){
    drop.querySelector(".big").textContent="📄 "+f.name;
    const r=new FileReader();
    if(f.name.endsWith(".pdf")){r.onload=()=>{ta.value="[PDF loaded: "+f.name+" — will be parsed on the server]";ta._pdf={name:f.name,b64:r.result.split(",")[1]};};r.readAsDataURL(f);}
    else{r.onload=()=>ta.value=r.result;r.readAsText(f);}
  }
  btn.onclick=async()=>{
    const text=ta.value.trim();if(!text){toast("Paste or drop a document first");return;}
    resHost.innerHTML='<div class="card"><span class="spin"></span> Extracting controls…</div>';
    let data;
    if(STATE.mode==="demo"){data=demoExtract(text);}
    else{try{
      if(ta._pdf){data=await apiPOST(withTenant("/v1/documents/upload"),{filename:ta._pdf.name,content_base64:ta._pdf.b64});}
      else{data=await apiPOST(withTenant("/v1/documents/extract"),{text,source:"dashboard_upload"});}
    }catch(e){toast("Error: "+e.message);resHost.innerHTML="";return;}}
    renderExtract(resHost,data);
  };
};
function demoExtract(text){
  const t=text.toLowerCase();const found=[];
  const map=[["mfa|multi-factor|2fa","IA-2","Multi-factor authentication required"],["encrypt|aes|at rest","SC-28","Encryption at rest"],
    ["tls|in transit|ssl","SC-8","Encryption in transit"],["vulnerab|scan|patch","RA-5","Vulnerability scanning"],
    ["audit log|logging|retain","AU-2","Audit logging"],["access control|least privilege","AC-3","Access enforcement"],
    ["account|dormant|deprovision","AC-2","Account management"],["backup|recovery","CP-9","System backup"]];
  map.forEach(([kw,cid,label])=>{if(new RegExp(kw).test(t)){const sent=text.split(/[.\n]/).find(s=>new RegExp(kw).test(s.toLowerCase()))||label;
    found.push({control_id:cid,concepts:[label.toLowerCase()],quote:sent.trim().slice(0,160),confidence:0.5,frameworks:["NIST_800_53"]});}});
  return {markdown_chars:text.length,extraction_method:"lexicon",controls_found:found.length,controls:found,
    events:found.map(c=>({control_id:c.control_id,status:"pass",severity:"info",evidence:{from_document:true,quote:c.quote}}))};
}
function renderExtract(host,data){
  host.innerHTML="";
  const sum=el("div","card");

// Renders a pill bar + composes existing RENDER.* functions into sub-panes.
// Each existing render calls main(); we redirect that via RENDER_TARGET so the
// working code is reused verbatim — no duplication, no regression risk.
function subTabs(title, desc, panes, stateKey){
  const m=main(), v=view(title, desc);
  m.appendChild(v);
  const pills=el("div","pilltabs");
  const paneHost=el("div");
  let active=SUBTAB_STATE[stateKey]||panes[0].id;
  if(!panes.find(p=>p.id===active))active=panes[0].id;
  panes.forEach(p=>{
    const b=el("button");b.textContent=p.label;if(p.id===active)b.classList.add("on");
    b.onclick=()=>{SUBTAB_STATE[stateKey]=p.id;pills.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");runPane(p);};
    pills.appendChild(b);
  });
  v.appendChild(pills);v.appendChild(paneHost);
  function runPane(p){
    RENDER_TARGET=paneHost;
    try{const r=p.render();if(r&&r.then)r.catch(e=>{paneHost.innerHTML=`<div class="card"><div class="empty">Error: ${esc(e.message)}</div></div>`;});}
    catch(e){paneHost.innerHTML=`<div class="card"><div class="empty">Error: ${esc(e.message)}</div></div>`;}
    finally{RENDER_TARGET=null;}
  }
  runPane(panes.find(p=>p.id===active));
}

  FW.forEach((f,i)=>fPos[f[1]]={x:colX[2],y:yFor(i,FW.length),label:f[0]});

  svg+=`</g>`;
  // edges connector->control (only to shown controls)
  showConns.forEach(c=>{const from=cPos[c.id];(connCtrl.filter(([s])=>s===c.id)).forEach(([,ct])=>{const to=ctPos[ct];if(to&&to.node){const risk=to.node.status==="fail"||to.node.status==="risk";svg+=edge(from.x+14,from.y,to.x-16,to.y,risk?COL.risk:COL.connector,risk);}});});
  // edges control->framework
  showCtrls.forEach(c=>{const from=ctPos[c.id];if(!from)return;(ctrlFw[c.id]||[]).forEach(fw=>{const to=fPos[fw];if(to){const risk=from.node.status==="fail"||from.node.status==="risk";svg+=edge(from.x+16,from.y,to.x-16,to.y,risk?COL.risk:COL.framework,risk);}});});
  // nodes: connectors
  showConns.forEach(c=>{const p=cPos[c.id];svg+=`<circle cx="${p.x}" cy="${p.y}" r="13" fill="#0a0d14" stroke="${COL.connector}" stroke-width="2"/><text x="${p.x}" y="${p.y-22}" fill="#9aa6bd" font-family="var(--mono)" font-size="12" text-anchor="middle">${esc(c.label)}</text>`;});
  // nodes: controls
  showCtrls.forEach(c=>{const p=ctPos[c.id];const risk=c.status==="fail"||c.status==="risk";const col=risk?COL.risk:COL.control;
    svg+=`<circle cx="${p.x}" cy="${p.y}" r="15" fill="${risk?'rgba(248,113,113,.25)':'rgba(167,139,250,.18)'}" stroke="${col}" stroke-width="2.5"/><text x="${p.x}" y="${p.y-24}" fill="#9aa6bd" font-family="var(--mono)" font-size="12" text-anchor="middle">${esc(c.label.replace('ct_',''))}</text>`;});
  // nodes: frameworks
  FW.forEach(f=>{const p=fPos[f[1]];svg+=`<circle cx="${p.x}" cy="${p.y}" r="15" fill="#0a0d14" stroke="${COL.framework}" stroke-width="2.5"/><text x="${p.x+24}" y="${p.y+4}" fill="#cbd5e8" font-family="var(--mono)" font-size="13">${esc(f[0])}</text>`;});
  svg+=`</svg>`;
  left.innerHTML=`<div style="font-size:17px;font-weight:700;margin-bottom:2px">Risk flows from sources to frameworks</div>
    <div class="sub" style="margin-bottom:8px">Every node is live evidence. Trace a failing control to the frameworks it puts at risk.</div>${svg}`;
  wrap.appendChild(left);
  // right: live evidence feed
  const right=el("div","card");
  right.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><span class="sdot" style="background:var(--pass)"></span><b style="font-size:14px">Live evidence feed</b></div>`+
    DEMO_FEED.map(f=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)">
      <div style="font-size:13px;color:var(--txt);margin-bottom:3px">${esc(f.t)}</div>
      <div style="font-family:var(--mono);font-size:11px;color:${f.c}">${esc(f.d)}</div></div>`).join("");
  wrap.appendChild(right);
  v.appendChild(wrap);
}

/* ════════════════════ SVG CHART TOOLKIT (no deps, themeable) ════════════════════ */
const CHART_COL={pass:"#34d399",fail:"#f87171",warn:"#fbbf24",hi:"#5b9cf6",purple:"#a78bfa",info:"#38bdf8",mid:"#6b7689",dim:"#8b97ad"};
const SEV_COL={critical:"#f87171",high:"#fb923c",medium:"#fbbf24",low:"#5b9cf6",info:"#6b7689"};
const STATUS_COL={pass:"#34d399",fail:"#f87171",error:"#fb923c",not_applicable:"#6b7689",pending:"#a78bfa"};

// ── DONUT chart: [{label,value,color}] ──
function svgDonut(data,opts={}){
  const size=opts.size||180,r=size/2,inner=opts.inner||r*0.62,cx=r,cy=r;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let a0=-Math.PI/2,paths="";
  data.forEach(d=>{
    const frac=d.value/total,a1=a0+frac*Math.PI*2;
    if(frac>0){
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const xi0=cx+inner*Math.cos(a1),yi0=cy+inner*Math.sin(a1),xi1=cx+inner*Math.cos(a0),yi1=cy+inner*Math.sin(a0);
      const large=frac>0.5?1:0;
      paths+=`<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${inner},${inner} 0 ${large} 0 ${xi1},${yi1} Z" fill="${d.color}" opacity="0.9"><title>${esc(d.label)}: ${d.value}</title></path>`;
    }
    a0=a1;
  });
  const center=opts.center!=null?`<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="var(--txt)" font-size="${opts.centerSize||26}" font-weight="700" font-family="var(--mono)">${opts.center}</text>${opts.centerLabel?`<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--dim)" font-size="10">${esc(opts.centerLabel)}</text>`:""}`:"";
  const legend=opts.legend===false?"":`<div style="display:flex;flex-direction:column;gap:6px;font-size:12px">${data.map(d=>`<div style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:2px;background:${d.color};flex-shrink:0"></span><span style="color:var(--mid)">${esc(d.label)}</span><span style="margin-left:auto;color:var(--txt);font-family:var(--mono)">${d.value}</span></div>`).join("")}</div>`;
  return `<div style="display:flex;align-items:center;gap:20px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">${paths}${center}</svg>${legend}</div>`;
}

// ── horizontal BAR chart: [{label,value,color?}] ──
function svgBars(data,opts={}){
  const max=opts.max||Math.max(...data.map(d=>d.value),1);
  const barH=opts.barH||26,gap=8,labelW=opts.labelW||120,W=opts.width||420;
  const h=data.length*(barH+gap);
  return `<svg width="100%" viewBox="0 0 ${W} ${h}" style="max-width:${W}px">${
    data.map((d,i)=>{const y=i*(barH+gap),bw=(d.value/max)*(W-labelW-50);
      const c=d.color||CHART_COL.hi;
      return `<text x="0" y="${y+barH/2+4}" fill="var(--mid)" font-size="12">${esc(d.label)}</text>
        <rect x="${labelW}" y="${y}" width="${W-labelW-50}" height="${barH}" rx="4" fill="rgba(255,255,255,.04)"/>
        <rect x="${labelW}" y="${y}" width="${Math.max(bw,2)}" height="${barH}" rx="4" fill="${c}" opacity="0.85"><title>${esc(d.label)}: ${d.value}</title></rect>
        <text x="${labelW+Math.max(bw,2)+8}" y="${y+barH/2+4}" fill="var(--txt)" font-size="12" font-family="var(--mono)">${d.display||d.value}</text>`;}).join("")
  }</svg>`;
}

// ── STACKED AREA (trend over time): series=[{name,color,values:[]}], labels=[] ──
function svgStackedArea(series,labels,opts={}){
  const W=opts.width||640,H=opts.height||200,pad=30,padB=24;
  const n=labels.length;if(!n)return"";
  const totals=labels.map((_,i)=>series.reduce((s,ser)=>s+(ser.values[i]||0),0));
  const max=Math.max(...totals,1);
  const px=i=>pad+i*(W-pad-10)/Math.max(n-1,1);
  const py=v=>H-padB-(v/max)*(H-pad-padB);
  let acc=labels.map(()=>0),areas="";
  series.forEach(ser=>{
    const top=labels.map((_,i)=>acc[i]+(ser.values[i]||0));
    const up=top.map((v,i)=>`${px(i)},${py(v)}`).join(" ");
    const down=acc.map((v,i)=>`${px(n-1-i)},${py(acc[n-1-i])}`).join(" ");
    areas+=`<polygon points="${up} ${down}" fill="${ser.color}" opacity="0.7"><title>${esc(ser.name)}</title></polygon>`;
    acc=top;
  });
  const xlabels=labels.map((l,i)=>(i%Math.ceil(n/6)===0)?`<text x="${px(i)}" y="${H-6}" fill="var(--dim)" font-size="9" text-anchor="middle">${esc(l)}</text>`:"").join("");
  const gridY=[0,0.5,1].map(f=>`<line x1="${pad}" y1="${py(max*f)}" x2="${W-10}" y2="${py(max*f)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-4}" y="${py(max*f)+3}" fill="var(--dim)" font-size="9" text-anchor="end">${Math.round(max*f)}</text>`).join("");
  const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px">${series.map(s=>`<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:${s.color}"></span><span style="color:var(--mid)">${esc(s.name)}</span></span>`).join("")}</div>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:100%">${gridY}${areas}${xlabels}</svg>${legend}`;
}

// ── RADAR chart: axes=[{label,value 0..1}] ──
function svgRadar(axes,opts={}){
  const size=opts.size||280,c=size/2,rmax=c*0.72,n=axes.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,r)=>[c+r*rmax*Math.cos(ang(i)),c+r*rmax*Math.sin(ang(i))];
  let rings="";[0.25,0.5,0.75,1].forEach(f=>{
    rings+=`<polygon points="${axes.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  let spokes="",labels="";
  axes.forEach((a,i)=>{const[x,y]=pt(i,1);
    spokes+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    const[lx,ly]=pt(i,1.16);
    labels+=`<text x="${lx}" y="${ly}" fill="var(--mid)" font-size="10" text-anchor="middle" dominant-baseline="middle">${esc(a.label)}</text>`;});
  const poly=axes.map((a,i)=>pt(i,Math.max(0,Math.min(1,a.value))).join(",")).join(" ");
  const dots=axes.map((a,i)=>{const[x,y]=pt(i,Math.max(0,Math.min(1,a.value)));return `<circle cx="${x}" cy="${y}" r="3" fill="${CHART_COL.hi}"/>`;}).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${spokes}<polygon points="${poly}" fill="rgba(91,156,246,.25)" stroke="${CHART_COL.hi}" stroke-width="2"/>${dots}${labels}</svg>`;
}

// ── RISK MATRIX 5×5 heatmap: risks=[{likelihood 1-5,impact 1-5,title}] ──
function svgRiskMatrix(risks,opts={}){
  const cell=opts.cell||62,pad=42,W=pad+5*cell+10,H=pad+5*cell+30;
  // risk band color by likelihood*impact
  const band=(l,i)=>{const s=l*i;return s>=15?"rgba(248,113,113,.30)":s>=8?"rgba(251,146,60,.26)":s>=4?"rgba(251,191,36,.22)":"rgba(52,211,153,.18)";};
  let cells="";
  for(let i=5;i>=1;i--){for(let l=1;l<=5;l++){
    const x=pad+(l-1)*cell,y=pad+(5-i)*cell;
    cells+=`<rect x="${x}" y="${y}" width="${cell-2}" height="${cell-2}" rx="4" fill="${band(l,i)}" stroke="var(--line)"/>`;
  }}
  // axis labels
  let axes="";
  for(let l=1;l<=5;l++)axes+=`<text x="${pad+(l-1)*cell+cell/2}" y="${H-8}" fill="var(--dim)" font-size="10" text-anchor="middle">${l}</text>`;
  for(let i=5;i>=1;i--)axes+=`<text x="${pad-10}" y="${pad+(5-i)*cell+cell/2+4}" fill="var(--dim)" font-size="10" text-anchor="end">${i}</text>`;
  axes+=`<text x="${pad+2.5*cell}" y="${H+4}" fill="var(--mid)" font-size="11" text-anchor="middle" font-weight="600">Impact →</text>`;
  axes+=`<text x="12" y="${pad+2.5*cell}" fill="var(--mid)" font-size="11" text-anchor="middle" font-weight="600" transform="rotate(-90 12 ${pad+2.5*cell})">Likelihood →</text>`;
  // bubble per cell (count of risks)
  const byCell={};
  risks.forEach(r=>{const l=Math.max(1,Math.min(5,r.impact||3)),i=Math.max(1,Math.min(5,r.likelihood||3));const k=`${l},${i}`;(byCell[k]=byCell[k]||[]).push(r);});
  let bubbles="";
  Object.entries(byCell).forEach(([k,rs])=>{const[l,i]=k.split(",").map(Number);
    const x=pad+(l-1)*cell+cell/2,y=pad+(5-i)*cell+cell/2;
    const sev=l*i>=15?CHART_COL.fail:l*i>=8?"#fb923c":l*i>=4?CHART_COL.warn:CHART_COL.pass;
    bubbles+=`<circle cx="${x}" cy="${y}" r="${Math.min(13,8+rs.length*2)}" fill="${sev}" opacity="0.9"><title>${rs.map(r=>esc(r.title||"risk")).join(", ")}</title></circle><text x="${x}" y="${y+4}" fill="#0a0d14" font-size="12" font-weight="700" text-anchor="middle">${rs.length}</text>`;});
  return `<svg width="100%" viewBox="0 0 ${W} ${H+12}" style="max-width:${W}px">${cells}${axes}${bubbles}</svg>`;
}

// ── GAUGE (semicircle): value 0..100 ──
function svgGauge(value,opts={}){
  const size=opts.size||180,c=size/2,r=c*0.78,sw=14;
  const v=Math.max(0,Math.min(100,value));
  const a0=Math.PI,a1=Math.PI+(v/100)*Math.PI;
  const arc=(start,end)=>{const x0=c+r*Math.cos(start),y0=c+r*Math.sin(start),x1=c+r*Math.cos(end),y1=c+r*Math.sin(end);return `M${x0},${y0} A${r},${r} 0 ${end-start>Math.PI?1:0} 1 ${x1},${y1}`;};
  const col=v>=75?CHART_COL.pass:v>=50?CHART_COL.warn:CHART_COL.fail;
  return `<svg width="${size}" height="${size*0.62}" viewBox="0 0 ${size} ${size*0.62}">
    <path d="${arc(Math.PI,2*Math.PI)}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="${arc(a0,a1)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>
    <text x="${c}" y="${c-2}" text-anchor="middle" fill="var(--txt)" font-size="30" font-weight="700" font-family="var(--mono)">${Math.round(v)}</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" fill="var(--dim)" font-size="11">${esc(opts.label||"")}</text>
  </svg>`;
}

// helper: wrap a chart in a titled card
function chartCard(title,sub,inner){
  return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub" style="margin-bottom:14px">${esc(sub)}</div>`:'<div style="height:8px"></div>'}${inner}</div>`;
}
