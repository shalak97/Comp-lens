name: Add evidence mindmap (LLM-grounded)

on:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require full-coverage to have run first
        run: |
          if [ ! -f app/services/framework_catalog.py ]; then
            echo "::error::Run the 'Add full framework coverage' workflow first — evidence graph depends on the catalog."
            exit 1
          fi

      - name: Unpack evidence files (lexicon, llm_client, evidence_graph, migration)
        run: echo "" | base64 -d | tar xzf - -C .

      - name: Ensure Float import in models.py (idempotent)
        run: |
          python3 - <<'PYFIX'
          import re,io
          p='app/models.py'; s=open(p).read()
          if 'Float' not in re.search(r'from sqlalchemy import \(([^)]*)\)', s, re.S).group(1):
              s=s.replace('from sqlalchemy import (JSON, Boolean, DateTime, Enum,',
                          'from sqlalchemy import (JSON, Boolean, DateTime, Enum, Float,',1)
              open(p,'w').write(s); print('added Float import')
          else:
              print('Float already present')
          PYFIX

      - name: Append evidence models (idempotent)
        run: |
          if grep -q "class EvidenceDocument" app/models.py; then echo "models present -- skip"; else
            printf '\n\n' >> app/models.py; echo "" | base64 -d >> app/models.py; echo "models appended"; fi

      - name: Append evidence endpoints (idempotent)
        run: |
          if grep -q "add_evidence_document" app/main.py; then echo "endpoints present -- skip"; else
            printf '\n\n' >> app/main.py; echo "" | base64 -d >> app/main.py; echo "endpoints appended"; fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: LLM-grounded evidence mindmap (document -> concept -> control)"
          git push
