name: Add feature tests + fix stale doc counts

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode and unpack bundle
        run: |
          echo "" | base64 -d > /tmp/t.tgz
          tar xzf /tmp/t.tgz -C .

      - name: Apply (idempotent)
        run: |
          python3 _apply_tests.py
          rm -f _apply_tests.py _test_new_features.py _README.md _FIXES.md

      - name: Run full test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:////tmp/ci.db"
          APP_ENV: test
          ENABLE_SCHEDULER: "false"
          EVIDENCE_SIGNING_KEY: ci-test-key
        run: |
          pip install -r requirements.txt -q
          alembic upgrade head
          python3 -m pytest tests/ -q --tb=short

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" ||             git commit -m "test: add 36 new-feature tests; README + FIXES test count 133" && git push
