name: Wire dashboard into API

on:
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Move dashboard.html into app/static/
        run: |
          mkdir -p app/static
          if [ -f dashboard.html ]; then
            git mv -f dashboard.html app/static/dashboard.html
            echo "moved dashboard.html -> app/static/"
          elif [ -f app/static/dashboard.html ]; then
            echo "already in app/static/ -- ok"
          else
            echo "::error::dashboard.html not found at repo root. Upload it first."
            exit 1
          fi

      - name: Add /dashboard route to main.py (idempotent)
        run: |
          if grep -q "_serve_dashboard" app/main.py; then
            echo "route already present -- skipping"
          else
            echo "" | base64 -d >> app/main.py
            echo "route appended to app/main.py"
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/dashboard.html
          git diff --cached --quiet || git commit -m "feat: serve compliance console at /dashboard"
          git push
