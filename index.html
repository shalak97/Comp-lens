<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comp-Lens Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f5f7;min-height:100vh;padding:24px;color:#222}
  .wrap{max-width:1100px;margin:0 auto}
  header{background:#fff;padding:24px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:24px}
  h1{color:#5b4bd6;font-size:1.8rem;margin-bottom:4px}
  .sub{color:#666}
  .badge{display:inline-block;padding:8px 16px;border-radius:20px;margin-top:12px;font-weight:600;font-size:.9rem}
  .badge.ok{background:#d4edda;color:#155724}
  .badge.bad{background:#f8d7da;color:#721c24}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .card h2{color:#5b4bd6;font-size:1.2rem;margin-bottom:10px;border-bottom:2px solid #eee;padding-bottom:8px}
  button{padding:10px 16px;background:#5b4bd6;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-top:10px;margin-right:8px;font-weight:600}
  button:hover{background:#4a3cc0}
  button.danger{background:#dc3545}
  .resp{background:#f8f9fa;border-left:4px solid #5b4bd6;padding:12px;margin-top:12px;border-radius:4px;max-height:300px;overflow:auto;font-size:.85rem}
  .resp.ok{border-left-color:#28a745;background:#f3fff4}
  .resp.err{border-left-color:#dc3545;background:#fff5f5;color:#721c24}
  pre{white-space:pre-wrap;word-wrap:break-word}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}
  th{background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #ddd}
  td{padding:8px;border-bottom:1px solid #eee}
  code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Comp-Lens Dashboard</h1>
    <p class="sub">Compliance & risk assessment — running on Vercel</p>
    <div id="badge" class="badge bad">Checking…</div>
  </header>
  <div class="grid">
    <div class="card"><h2>Connection</h2><p id="apiUrl"></p>
      <button onclick="test()">Test connection</button><div id="r1" class="resp" hidden></div></div>
    <div class="card"><h2>Controls</h2>
      <button onclick="controls()">Load controls</button><div id="r2" class="resp" hidden></div></div>
    <div class="card"><h2>Run assessment</h2>
      <button onclick="run(false)">Demo (pass)</button>
      <button class="danger" onclick="run(true)">Demo (fail)</button><div id="r3" class="resp" hidden></div></div>
    <div class="card"><h2>Summary</h2>
      <button onclick="summary()">Load summary</button><div id="r4" class="resp" hidden></div></div>
  </div>
</div>
<script>
  // Same-origin: the API is served by the same Vercel deployment.
  const API = window.location.origin;
  document.getElementById('apiUrl').innerHTML = 'API base: <code>' + API + '/api</code>';

  async function call(path, opts){ const r = await fetch(API + path, opts);
    if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  function show(id, ok, html){ const d=document.getElementById(id);
    d.hidden=false; d.className='resp '+(ok?'ok':'err'); d.innerHTML=html; }

  async function test(){
    try{ const d=await call('/api/health/live');
      show('r1',true,'<strong>Connected</strong><pre>'+JSON.stringify(d,null,2)+'</pre>');
      const b=document.getElementById('badge'); b.className='badge ok'; b.textContent='Connected';
    }catch(e){ show('r1',false,'Failed: '+e.message);
      const b=document.getElementById('badge'); b.className='badge bad'; b.textContent='Backend unavailable'; }
  }
  async function controls(){
    try{ const d=await call('/api/controls'); let t='<table><tr><th>ID</th><th>Title</th><th>Frameworks</th></tr>';
      d.forEach(c=>t+='<tr><td>'+c.control_id+'</td><td>'+c.title+'</td><td>'+c.frameworks.join(', ')+'</td></tr>');
      show('r2',true,t+'</table>'); }catch(e){ show('r2',false,e.message); }
  }
  async function run(fail){
    try{ const d=await call('/api/assessments',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({tenant_id:'demo',control_id:fail?'SC-28':'SC-7',source_system:'DEMO',fail})});
      show('r3',true,'<strong>'+d.result+'</strong><pre>'+JSON.stringify(d,null,2)+'</pre>'); }
    catch(e){ show('r3',false,e.message); }
  }
  async function summary(){
    try{ const d=await call('/api/summary?tenant_id=demo');
      const col=d.compliance_score>=80?'#28a745':'#dc3545';
      show('r4',true,'<div style="font-size:2.5rem;font-weight:700;color:'+col+';text-align:center">'+d.compliance_score+'%</div><pre>'+JSON.stringify(d,null,2)+'</pre>'); }
    catch(e){ show('r4',false,e.message); }
  }
  test();
</script>
</body>
</html>
