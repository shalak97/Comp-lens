<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comp-Lens · 3D Ontology Mesh</title>
<style>
  :root{
    --bg:#070b16; --panel:rgba(17,24,39,.82); --border:#1e2d45;
    --accent:#00d4ff; --green:#00e676; --red:#ff5252; --amber:#ffab40;
    --purple:#a78bfa; --blue:#5b9cff; --text:#e0e8f0; --muted:#5a7290;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono)}
  #canvas-wrap{position:fixed;inset:0}
  canvas{display:block}

  .overlay{position:fixed;z-index:10}

  /* top-left: title + connect */
  #topleft{top:0;left:0;padding:18px 20px;max-width:340px}
  .title{font-size:1rem;font-weight:600;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
  .subtitle{font-size:.66rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px}
  .conn-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;backdrop-filter:blur(10px)}
  .conn-box label{font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
  .conn-box input{width:100%;font-family:var(--mono);font-size:.72rem;padding:7px 9px;background:#0c1322;
    border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;margin-bottom:8px}
  .conn-box input:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px}
  .btn{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;padding:8px 12px;border-radius:6px;
    border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:.2s;flex:1}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#070b16;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{box-shadow:0 0 16px rgba(0,212,255,.4)}
  .status{display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--muted);margin-top:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.off{background:var(--red)}

  /* bottom-left: legend */
  #legend{bottom:0;left:0;padding:18px 20px;background:transparent}
  .legend-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;backdrop-filter:blur(10px)}
  .legend-title{font-size:.6rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
  .leg{display:flex;align-items:center;gap:8px;font-size:.68rem;margin:5px 0;color:#b7c6d8}
  .swatch{width:10px;height:10px;border-radius:50%}

  /* right: info panel */
  #info{top:0;right:0;padding:18px 20px;width:300px;transform:translateX(360px);transition:transform .3s}
  #info.show{transform:none}
  .info-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;backdrop-filter:blur(10px)}
  .info-type{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .info-name{font-size:.95rem;font-weight:600;margin-bottom:10px;word-break:break-word}
  .info-kv{display:flex;justify-content:space-between;font-size:.7rem;padding:5px 0;border-bottom:1px solid rgba(30,45,69,.5)}
  .info-kv:last-child{border-bottom:none}
  .info-kv .k{color:var(--muted)}
  .info-links{margin-top:10px;font-size:.66rem;color:var(--muted)}
  .info-links span{color:var(--accent)}
  .pill{display:inline-block;padding:1px 7px;border-radius:4px;font-size:.6rem;font-weight:600}
  .pill.pass{background:rgba(0,230,118,.16);color:var(--green)}
  .pill.fail{background:rgba(255,82,82,.16);color:var(--red)}
  .pill.healthy{background:rgba(0,230,118,.16);color:var(--green)}
  .pill.nocreds{background:rgba(255,171,64,.16);color:var(--amber)}

  /* bottom-right: stats */
  #stats{bottom:0;right:0;padding:18px 20px;text-align:right;font-size:.64rem;color:var(--muted);line-height:1.9}
  #stats b{color:var(--accent);font-weight:600}

  /* hover label */
  #hoverlabel{position:fixed;z-index:20;pointer-events:none;background:rgba(7,11,22,.92);
    border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:.68rem;
    color:var(--text);display:none;white-space:nowrap}

  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;
    font-size:.62rem;color:var(--muted);letter-spacing:.06em;text-align:center}
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div class="overlay" id="topleft">
  <div class="title">COMP-LENS</div>
  <div class="subtitle">// 3D compliance ontology mesh</div>
  <div class="conn-box">
    <label>API base URL</label>
    <input id="apiBase" value="https://comp-lens.onrender.com">
    <label>X-API-Key (optional)</label>
    <input id="apiKey" type="password" placeholder="leave blank if auth off">
    <label>Tenant (for live findings)</label>
    <input id="tenant" value="acme">
    <div class="row">
      <button class="btn primary" onclick="connectAndBuild()">Connect</button>
      <button class="btn" onclick="buildStatic()">Offline</button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">not connected</span></div>
  </div>
</div>

<div class="overlay" id="legend">
  <div class="legend-card">
    <div class="legend-title">Ontology</div>
    <div class="leg"><span class="swatch" style="background:#00d4ff"></span>Framework</div>
    <div class="leg"><span class="swatch" style="background:#a78bfa"></span>Domain</div>
    <div class="leg"><span class="swatch" style="background:#5b9cff"></span>Control</div>
    <div class="leg"><span class="swatch" style="background:#00e676"></span>Connector</div>
    <div class="leg"><span class="swatch" style="background:#ffab40"></span>Category</div>
    <div class="leg"><span class="swatch" style="background:#ff5252"></span>Finding (fail)</div>
    <div class="leg"><span class="swatch" style="background:#7fffd4"></span>Finding (pass)</div>
  </div>
</div>

<div class="overlay" id="info">
  <div class="info-card">
    <div class="info-type" id="iType">NODE</div>
    <div class="info-name" id="iName">—</div>
    <div id="iBody"></div>
    <div class="info-links" id="iLinks"></div>
  </div>
</div>

<div class="overlay" id="stats">
  <div><b id="sNodes">0</b> nodes</div>
  <div><b id="sEdges">0</b> connections</div>
  <div><b id="sFindings">0</b> live findings</div>
</div>

<div id="hoverlabel"></div>
<div class="hint">drag to rotate · scroll to zoom · hover a node · click to inspect</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────
// STATIC ONTOLOGY KNOWLEDGE (relationships are part of the platform design)
// Live API enriches these nodes with status (control meta, connector health,
// and real findings).
// ─────────────────────────────────────────────────────────────────────────
const FRAMEWORKS = ["NIST"];

const CONTROL_DOMAIN = {
  "AC-2-7":"Access Control", "AC-2-3":"Access Control",
  "CM-3":"Configuration Management",
  "SC-28":"System & Communications", "SC-7":"System & Communications", "SC-28-HOST":"System & Communications",
  "AU-2":"Audit & Accountability",
  "RA-5":"Risk Assessment",
  "SA-15-BRANCH":"System & Services Acquisition", "SA-15-SECRETS":"System & Services Acquisition",
};
const CONTROL_TITLE = {
  "AC-2-7":"Privileged MFA","AC-2-3":"Inactive accounts","CM-3":"Change approval",
  "SC-28":"Encryption at rest","SC-7":"No public exposure","AU-2":"Audit logging",
  "RA-5":"Vuln remediation","SA-15-BRANCH":"Branch protection","SA-15-SECRETS":"Secret scanning",
  "SC-28-HOST":"Host disk encryption",
};
// which connectors can assess which control
const CONTROL_CONNECTORS = {
  "AC-2-7":["AWS","OKTA","AZURE","DEMO"], "AC-2-3":["AWS","OKTA","DEMO"],
  "CM-3":["JIRA","SERVICENOW","DEMO"], "SC-28":["AWS","GCP","DEMO"],
  "SC-7":["AWS","GCP","SLACK","DEMO"], "AU-2":["AWS","SSH","DEMO"],
  "RA-5":["QUALYS","CROWDSTRIKE","DEMO"], "SA-15-BRANCH":["GITHUB","GITLAB","DEMO"],
  "SA-15-SECRETS":["GITHUB","DEMO"], "SC-28-HOST":["SSH","DEMO"],
};
const CONNECTOR_CATEGORY = {
  AWS:"cloud", AZURE:"cloud", GCP:"cloud", OKTA:"identity",
  GITHUB:"code", GITLAB:"code", JIRA:"ticketing", SERVICENOW:"ticketing",
  QUALYS:"vuln", CROWDSTRIKE:"endpoint", SSH:"on-prem", SLACK:"saas", DEMO:"testing",
};

const COLORS = {
  framework:0x00d4ff, domain:0xa78bfa, control:0x5b9cff,
  connector:0x00e676, category:0xffab40,
  finding_fail:0xff5252, finding_pass:0x7fffd4, finding_other:0xffab40,
};

// ─────────────────────────────────────────────────────────────────────────
// THREE.JS SCENE
// ─────────────────────────────────────────────────────────────────────────
let scene, camera, renderer, graphGroup, raycaster, mouse;
let nodeMeshes = [], edgeLines = [], nodeById = {};
let hovered = null, selected = null;
let autoRotate = true, dragging = false, lastX=0, lastY=0, rotV={x:0,y:0};
let camDist = 320;
const R = 130;

initScene();
buildStatic();   // start with the static ontology so it's never blank
animate();

function initScene(){
  const wrap = document.getElementById('canvas-wrap');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b16, 0.0016);

  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 4000);
  camera.position.set(0,0,camDist);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  wrap.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const p = new THREE.PointLight(0x66ccff, 0.7); p.position.set(200,200,300); scene.add(p);

  graphGroup = new THREE.Group();
  scene.add(graphGroup);

  // structural wireframe sphere (the "mesh")
  const wire = new THREE.Mesh(
    new THREE.IcosahedronGeometry(R, 3),
    new THREE.MeshBasicMaterial({color:0x16243d, wireframe:true, transparent:true, opacity:0.35})
  );
  graphGroup.add(wire);
  const inner = new THREE.Mesh(
    new THREE.SphereGeometry(R*0.985, 32, 32),
    new THREE.MeshBasicMaterial({color:0x0a1426, transparent:true, opacity:0.45})
  );
  graphGroup.add(inner);

  raycaster = new THREE.Raycaster();
  raycaster.params.Points = {threshold: 6};
  mouse = new THREE.Vector2();

  // events
  renderer.domElement.addEventListener('pointerdown', e=>{dragging=true;autoRotate=false;lastX=e.clientX;lastY=e.clientY;});
  addEventListener('pointerup', ()=>dragging=false);
  addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('wheel', e=>{e.preventDefault();camDist=Math.max(170,Math.min(700,camDist+e.deltaY*0.3));},{passive:false});
  renderer.domElement.addEventListener('click', onClick);
  addEventListener('resize', ()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

// fibonacci sphere point (i of n) -> unit vector
function fibSphere(i, n){
  const phi = Math.acos(1 - 2*(i+0.5)/n);
  const theta = Math.PI*(1+Math.sqrt(5))*(i+0.5);
  return new THREE.Vector3(
    Math.sin(phi)*Math.cos(theta),
    Math.sin(phi)*Math.sin(theta),
    Math.cos(phi)
  );
}

function clearGraph(){
  nodeMeshes.forEach(m=>{graphGroup.remove(m); m.geometry.dispose(); m.material.dispose();});
  edgeLines.forEach(l=>{graphGroup.remove(l); l.geometry.dispose(); l.material.dispose();});
  nodeMeshes=[]; edgeLines=[]; nodeById={};
}

// build nodes/edges from an ontology spec {nodes:[{id,type,label,meta}], edges:[[a,b]]}
function renderOntology(spec){
  clearGraph();
  const n = spec.nodes.length;
  // radius tiers per type so layers separate visually
  const tier = {framework:R*0.40, domain:R*0.66, control:R*0.92, connector:R*1.12, category:R*1.34};
  // group nodes by type, distribute each group around the sphere
  const byType = {};
  spec.nodes.forEach(nd=>{(byType[nd.type]=byType[nd.type]||[]).push(nd);});

  Object.keys(byType).forEach(type=>{
    const grp = byType[type];
    const baseR = (type.startsWith('finding')) ? R*1.5 : (tier[type]||R*1.1);
    grp.forEach((nd,i)=>{
      const v = fibSphere(i + (type.length*3), grp.length + 2).multiplyScalar(baseR);
      const isFinding = type.startsWith('finding');
      const size = type==='framework'?7 : type==='domain'?5.5 : type==='control'?4.5
                 : type==='connector'?4.5 : type==='category'?5 : 2.8;
      const color = COLORS[type] || 0x8899aa;
      const geo = new THREE.SphereGeometry(size, 16, 16);
      const mat = new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.45, roughness:0.4, metalness:0.1});
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(v);
      mesh.userData = nd;
      mesh.userData.baseColor = color;
      mesh.userData.baseSize = size;
      graphGroup.add(mesh);
      nodeMeshes.push(mesh);
      nodeById[nd.id] = mesh;
    });
  });

  // edges as arcs bowed outward from sphere center
  spec.edges.forEach(([a,b])=>{
    const ma=nodeById[a], mb=nodeById[b];
    if(!ma||!mb) return;
    const pa=ma.position, pb=mb.position;
    const mid=pa.clone().add(pb).multiplyScalar(0.5);
    const lift=1 + 0.18; // bow outward
    mid.setLength(mid.length()*lift + 8);
    const curve=new THREE.QuadraticBezierCurve3(pa, mid, pb);
    const pts=curve.getPoints(24);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const mat=new THREE.LineBasicMaterial({color:0x2a466e, transparent:true, opacity:0.18});
    const line=new THREE.Line(geo, mat);
    line.userData={a,b};
    graphGroup.add(line);
    edgeLines.push(line);
  });

  document.getElementById('sNodes').textContent=nodeMeshes.length;
  document.getElementById('sEdges').textContent=edgeLines.length;
  document.getElementById('sFindings').textContent=spec.nodes.filter(x=>x.type.startsWith('finding')).length;
}

// build the static ontology spec from platform knowledge
function staticSpec(controlsMeta, connectorHealth, findings){
  const nodes=[], edges=[], seen=new Set();
  const add=(id,type,label,meta)=>{ if(!seen.has(id)){seen.add(id);nodes.push({id,type,label,meta:meta||{}});} };

  FRAMEWORKS.forEach(f=>add('fw:'+f,'framework',f));
  // domains
  const domains=[...new Set(Object.values(CONTROL_DOMAIN))];
  domains.forEach(d=>{ add('dom:'+d,'domain',d); edges.push(['fw:NIST','dom:'+d]); });
  // controls
  Object.keys(CONTROL_DOMAIN).forEach(cid=>{
    const meta = (controlsMeta&&controlsMeta[cid])||{};
    add('ctl:'+cid,'control', CONTROL_TITLE[cid]||cid, {control_id:cid, ...meta});
    edges.push(['dom:'+CONTROL_DOMAIN[cid], 'ctl:'+cid]);
  });
  // connectors + categories
  const cats=[...new Set(Object.values(CONNECTOR_CATEGORY))];
  cats.forEach(c=>add('cat:'+c,'category',c));
  Object.keys(CONNECTOR_CATEGORY).forEach(cn=>{
    const h = connectorHealth ? connectorHealth[cn] : null;
    add('con:'+cn,'connector',cn,{health:h});
    edges.push(['cat:'+CONNECTOR_CATEGORY[cn], 'con:'+cn]);
  });
  // connector -> control support
  Object.keys(CONTROL_CONNECTORS).forEach(cid=>{
    CONTROL_CONNECTORS[cid].forEach(cn=>{
      if(seen.has('con:'+cn)) edges.push(['con:'+cn,'ctl:'+cid]);
    });
  });
  // live findings -> control
  if(findings && findings.length){
    findings.slice(0,60).forEach((f,i)=>{
      const t = f.status==='pass'?'finding_pass':f.status==='fail'?'finding_fail':'finding_other';
      const id='fnd:'+(f.finding_id||i);
      add(id,t, f.control_id+' · '+(f.asset_id||''), f);
      if(seen.has('ctl:'+f.control_id)) edges.push([id,'ctl:'+f.control_id]);
    });
  }
  return {nodes,edges};
}

function buildStatic(){
  renderOntology(staticSpec(null,null,null));
  setStatus(null,'offline ontology');
}

// ─────────────────────────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────────────────────────
const api = ()=>document.getElementById('apiBase').value.replace(/\/$/,'');
const key = ()=>document.getElementById('apiKey').value.trim();
const headers = ()=> key()?{'X-API-Key':key()}:{};

async function connectAndBuild(){
  setStatus('wait','connecting...');
  try{
    const root = await (await fetch(api()+'/', {signal:AbortSignal.timeout(20000)})).json();
    // control meta
    let controlsMeta={};
    try{
      const cs = await (await fetch(api()+'/controls')).json();
      cs.forEach(c=>controlsMeta[c.control_id]={title:c.title,domain:c.domain,severity:c.severity});
    }catch(e){}
    // connector health
    let health={};
    try{
      const cn = await (await fetch(api()+'/connectors',{headers:headers()})).json();
      cn.forEach(c=>health[c.source_system]=c.healthy);
    }catch(e){}
    // live findings
    let findings=[];
    try{
      const t=document.getElementById('tenant').value||'acme';
      const fr = await fetch(api()+'/findings?tenant_id='+encodeURIComponent(t),{headers:headers()});
      if(fr.ok) findings=await fr.json();
    }catch(e){}

    renderOntology(staticSpec(controlsMeta, health, findings));
    setStatus('on', 'connected · '+(findings.length)+' findings');
  }catch(e){
    setStatus('off','connection failed');
    buildStatic();
  }
}

function setStatus(state,txt){
  const dot=document.getElementById('dot');
  dot.className='dot'+(state==='on'?' on':state==='off'?' off':'');
  document.getElementById('statusTxt').textContent=txt;
}

// ─────────────────────────────────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────────────────────────────────
function onMove(e){
  if(dragging){
    rotV.y += (e.clientX-lastX)*0.005;
    rotV.x += (e.clientY-lastY)*0.005;
    rotV.x=Math.max(-1.4,Math.min(1.4,rotV.x));
    lastX=e.clientX; lastY=e.clientY;
  }
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  pickHover(e.clientX,e.clientY);
}

function pickHover(px,py){
  raycaster.setFromCamera(mouse, camera);
  const hits=raycaster.intersectObjects(nodeMeshes);
  const lbl=document.getElementById('hoverlabel');
  if(hits.length){
    const m=hits[0].object;
    if(hovered!==m){ hovered=m; }
    lbl.style.display='block';
    lbl.style.left=(px+12)+'px'; lbl.style.top=(py+12)+'px';
    lbl.textContent=m.userData.label||m.userData.id;
    document.body.style.cursor='pointer';
    highlightNeighbors(m);
  }else{
    hovered=null; lbl.style.display='none'; document.body.style.cursor='default';
    if(!selected) resetHighlight();
  }
}

function neighborsOf(mesh){
  const id=mesh.userData.id, set=new Set([id]);
  edgeLines.forEach(l=>{ if(l.userData.a===id) set.add(l.userData.b); if(l.userData.b===id) set.add(l.userData.a); });
  return set;
}

function highlightNeighbors(mesh){
  const set=neighborsOf(mesh);
  nodeMeshes.forEach(m=>{
    const on=set.has(m.userData.id);
    m.material.opacity = on?1:0.18;
    m.material.transparent = !on;
    m.material.emissiveIntensity = on?0.8:0.2;
    m.scale.setScalar(m===mesh?1.6:1);
  });
  edgeLines.forEach(l=>{
    const on=(l.userData.a===mesh.userData.id||l.userData.b===mesh.userData.id);
    l.material.opacity = on?0.7:0.05;
    l.material.color.setHex(on?0x00d4ff:0x2a466e);
  });
}

function resetHighlight(){
  nodeMeshes.forEach(m=>{ m.material.opacity=1; m.material.transparent=false; m.material.emissiveIntensity=0.45; m.scale.setScalar(1); });
  edgeLines.forEach(l=>{ l.material.opacity=0.18; l.material.color.setHex(0x2a466e); });
}

function onClick(){
  raycaster.setFromCamera(mouse, camera);
  const hits=raycaster.intersectObjects(nodeMeshes);
  if(hits.length){
    selected=hits[0].object;
    highlightNeighbors(selected);
    showInfo(selected.userData);
  }else{
    selected=null; resetHighlight();
    document.getElementById('info').classList.remove('show');
  }
}

function showInfo(d){
  const panel=document.getElementById('info');
  const typeLabel={framework:'Framework',domain:'Domain',control:'Control',connector:'Connector',
    category:'Category',finding_pass:'Finding',finding_fail:'Finding',finding_other:'Finding'}[d.type]||'Node';
  const typeColor={framework:'#00d4ff',domain:'#a78bfa',control:'#5b9cff',connector:'#00e676',
    category:'#ffab40',finding_pass:'#7fffd4',finding_fail:'#ff5252',finding_other:'#ffab40'}[d.type];
  document.getElementById('iType').textContent=typeLabel;
  document.getElementById('iType').style.color=typeColor;
  document.getElementById('iName').textContent=d.label||d.id;

  const m=d.meta||{}; let body='';
  const kv=(k,v)=>`<div class="info-kv"><span class="k">${k}</span><span>${v}</span></div>`;
  if(d.type==='control'){
    if(m.control_id) body+=kv('ID',m.control_id);
    if(m.domain) body+=kv('Domain',m.domain);
    if(m.severity) body+=kv('Severity',m.severity);
    const conns=(CONTROL_CONNECTORS[m.control_id]||[]).join(', ');
    if(conns) body+=kv('Assessed by',conns);
  }else if(d.type==='connector'){
    body+=kv('Category',CONNECTOR_CATEGORY[d.label]||'—');
    const h=m.health;
    const pill = h===true?'<span class="pill healthy">healthy</span>':h===false?'<span class="pill nocreds">no creds</span>':'—';
    body+=kv('Live health',pill);
    const supports=Object.keys(CONTROL_CONNECTORS).filter(c=>CONTROL_CONNECTORS[c].includes(d.label)).join(', ');
    if(supports) body+=kv('Supports',supports);
  }else if(d.type.startsWith('finding')){
    if(m.status) body+=kv('Status',`<span class="pill ${m.status==='pass'?'pass':'fail'}">${m.status}</span>`);
    if(m.control_id) body+=kv('Control',m.control_id);
    if(m.source_system) body+=kv('Source',m.source_system);
    if(m.severity) body+=kv('Severity',m.severity);
    if(m.asset_id) body+=kv('Asset',m.asset_id);
    if(m.owner) body+=kv('Owner',m.owner);
  }else if(d.type==='domain'){
    const ctls=Object.keys(CONTROL_DOMAIN).filter(c=>CONTROL_DOMAIN[c]===d.label).join(', ');
    body+=kv('Controls',ctls);
  }else if(d.type==='category'){
    const cons=Object.keys(CONNECTOR_CATEGORY).filter(c=>CONNECTOR_CATEGORY[c]===d.label).join(', ');
    body+=kv('Connectors',cons);
  }
  document.getElementById('iBody').innerHTML=body;
  const nb=neighborsOf(nodeById[d.id]).size-1;
  document.getElementById('iLinks').innerHTML=`<span>${nb}</span> connection${nb===1?'':'s'}`;
  panel.classList.add('show');
}

// ─────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate) rotV.y += 0.0016;
  graphGroup.rotation.y += (rotV.y - graphGroup.rotation.y)*0.1;
  graphGroup.rotation.x += (rotV.x - graphGroup.rotation.x)*0.1;
  camera.position.z += (camDist - camera.position.z)*0.08;
  // gentle node pulse
  const t=performance.now()*0.001;
  nodeMeshes.forEach((m,i)=>{ if(m!==hovered&&m!==selected) m.scale.setScalar(1+Math.sin(t*1.5+i)*0.04); });
  renderer.render(scene,camera);
}
</script>
</body>
